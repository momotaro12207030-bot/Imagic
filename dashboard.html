<head>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['IBM Plex Sans JP', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef6ff', 100: '#d9eaff', 200: '#bcdbff',
                            300: '#8ec5ff', 400: '#59a5ff', 500: '#3384fc',
                            600: '#1a64f1', 700: '#134ede', 800: '#1640b4', 900: '#173a8d',
                        },
                        surface: {
                            0: '#ffffff', 50: '#f8fafc', 100: '#f1f5f9',
                            200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8',
                            500: '#64748b', 600: '#475569', 700: '#334155',
                            800: '#1e293b', 900: '#0f172a',
                        },
                        area: {
                            blue: { light: '#eff6ff', mid: '#3b82f6', dark: '#1e40af', border: '#bfdbfe' },
                            emerald: { light: '#ecfdf5', mid: '#10b981', dark: '#065f46', border: '#a7f3d0' },
                            amber: { light: '#fffbeb', mid: '#f59e0b', dark: '#92400e', border: '#fde68a' },

                            cyan: { light: '#ecfeff', mid: '#06b6d4', dark: '#155e75', border: '#a5f3fc' },
                            teal: { light: '#f0fdfa', mid: '#14b8a6', dark: '#115e59', border: '#99f6e4' },

        }

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'IBM Plex Sans JP', sans-serif; }

        /* Worker items */
        .worker-item {
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .worker-item.selected {
            background-color: var(--select-bg, #dbeafe) !important;
            border-color: var(--select-border, #3b82f6) !important;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
        }
        .worker-item.sortable-ghost {
            opacity: 0.4;
            background: #e0e7ff !important;
        }
        .worker-item.sortable-chosen {
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transform: scale(1.04);
            z-index: 50;
        }
        .worker-item.sortable-drag {
            opacity: 0.9;
        }

        /* Drop zones */
        .drop-zone {
            min-height: 60px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .drop-zone.sortable-drag-over,
        .drop-zone.drag-highlight {
            background-color: #eff6ff !important;
            border-color: #3b82f6 !important;
            border-style: solid !important;
        }

        /* Selection marquee (desktop only) */
        #selection-marquee {
            position: fixed;
            border: 1.5px solid #3b82f6;
            background-color: rgba(59, 130, 246, 0.12);
            pointer-events: none;
            z-index: 100;
            display: none;
            border-radius: 2px;
        }

        /* Editable titles */
        .editable-title {
            outline: none;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.2s, background-color 0.2s;
            cursor: text;
            border-radius: 2px;
        }
        .editable-title:hover { border-bottom-color: currentColor; }
        .editable-title:focus {
            border-bottom-style: solid;
            border-bottom-color: #3b82f6;
            background-color: rgba(59,130,246,0.06);
            padding: 0 4px;
        }

        /* Action buttons visibility */
        .action-btn { opacity: 0; transition: opacity 0.15s; }
        @media (hover: none) { .action-btn { opacity: 0.6; } }
        .group:hover .action-btn,
        .worker-item:hover .action-btn { opacity: 1; }

        /* Mobile drawer */
        .drawer-overlay {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(2px);
            z-index: 40;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
        .drawer-panel {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 300px; max-width: 85vw;
            z-index: 41;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 25px rgba(0,0,0,0.15);
        }
        .drawer-panel.open { transform: translateX(0); }

        /* Toast */
        .toast-container {
            position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%) translateY(100px);
            z-index: 60; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .toast-container.visible { transform: translateX(-50%) translateY(0); }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Smooth count badge */
        .count-badge {
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Area card colors via CSS custom properties */
        .area-card[data-color="blue"] { --area-light: #eff6ff; --area-mid: #3b82f6; --area-dark: #1e40af; --area-border: #bfdbfe; }
        .area-card[data-color="emerald"] { --area-light: #ecfdf5; --area-mid: #10b981; --area-dark: #065f46; --area-border: #a7f3d0; }
        .area-card[data-color="amber"] { --area-light: #fffbeb; --area-mid: #f59e0b; --area-dark: #92400e; --area-border: #fde68a; }
        .area-card[data-color="purple"] { --area-light: #faf5ff; --area-mid: #8b5cf6; --area-dark: #5b21b6; --area-border: #ddd6fe; }
        .area-card[data-color="rose"] { --area-light: #fff1f2; --area-mid: #f43f5e; --area-dark: #9f1239; --area-border: #fecdd3; }
        .area-card[data-color="cyan"] { --area-light: #ecfeff; --area-mid: #06b6d4; --area-dark: #155e75; --area-border: #a5f3fc; }
        .area-card[data-color="teal"] { --area-light: #f0fdfa; --area-mid: #14b8a6; --area-dark: #115e59; --area-border: #99f6e4; }
        .area-card[data-color="indigo"] { --area-light: #eef2ff; --area-mid: #6366f1; --area-dark: #3730a3; --area-border: #c7d2fe; }

        .area-header { background: var(--area-light); border-bottom: 1px solid var(--area-border); }
        .area-badge-num { background: var(--area-mid); }
        .area-title { color: var(--area-dark); }
        .area-count { color: var(--area-mid); border-color: var(--area-border); }
    </style>
</head>

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const marquee = $('#selection-marquee');

    // ─── Init ───
    window.onload = () => {
        updateClock();
        setInterval(updateClock, 1000);
        checkMobile();
        window.addEventListener('resize', checkMobile);

        if (!loadDashboardState()) {
            initialWorkerNames.forEach(name => createWorker(name));
            const areas = [
                { name: 'INBOUND', color: 'blue', subs: ['Receive', 'Stow'] },
                { name: 'OUTBOUND', color: 'emerald', subs: ['Pick', 'SV'] },
                { name: 'SHIPDCK', color: 'amber', subs: ['項目 1', '項目 2'] },
                { name: 'QA', color: 'purple', subs: ['項目 1', '項目 2'] }
            ];
            areas.forEach(a => addMainArea(a.name, a.color, a.subs));
        }

        // Search events
        $('#worker-search-desktop')?.addEventListener('input', e => filterWorkers(e.target.value));
        $('#worker-search-mobile')?.addEventListener('input', e => filterWorkers(e.target.value));

        // Enter key for add worker
        $('#new-worker-name')?.addEventListener('keydown', e => { if (e.key === 'Enter') addNewWorkerFromInput('new-worker-name'); });
        $('#new-worker-name-mobile')?.addEventListener('keydown', e => { if (e.key === 'Enter') addNewWorkerFromInput('new-worker-name-mobile'); });

        // Marquee selection (desktop only)
        const container = $('.select-container');
        container.addEventListener('mousedown', startMarquee);
        window.addEventListener('mousemove', moveMarquee);
        window.addEventListener('mouseup', endMarquee);

        // Close mobile menu on outside click
        document.addEventListener('click', (e) => {
            if (State.mobileMenuOpen && !e.target.closest('#mobile-menu') && !e.target.closest('[onclick*="toggleMobileMenu"]')) {
                toggleMobileMenu(false);
            }
        });

        initPoolSortable();
        updateCounts();
    };

    function checkMobile() {
        State.isMobile = window.innerWidth < 768;
        syncMobilePool();
    }

    // ─── Clock ───
    function updateClock() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const full = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const short = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        const clockEl = $('#clock');
        const clockMobile = $('#clock-mobile');
        if (clockEl) clockEl.textContent = full;
        if (clockMobile) clockMobile.textContent = short;
    }

    // ─── Mobile UI ───
    function toggleDrawer(force) {
        State.drawerOpen = force !== undefined ? force : !State.drawerOpen;
        $('#drawer-overlay').classList.toggle('open', State.drawerOpen);
        $('#drawer-panel').classList.toggle('open', State.drawerOpen);
        if (State.drawerOpen) syncMobilePool();
    }

    function syncMobilePool() {
        // On mobile, we use the mobile pool; on desktop, the sidebar pool.
        // Workers always live in #worker-pool (desktop). On mobile drawer open, mirror them.
        // Actually, let's use a single pool and move it between containers.
        const pool = $('#worker-pool');
        const mobileContainer = $('#worker-pool-mobile');
        if (!pool || !mobileContainer) return;

        if (State.isMobile && State.drawerOpen) {
            // Move pool's children to mobile pool for display
            while (pool.firstChild) mobileContainer.appendChild(pool.firstChild);
            initPoolSortable();
        } else if (!State.isMobile) {
            // Move back to desktop
            while (mobileContainer.firstChild) pool.appendChild(mobileContainer.firstChild);
            initPoolSortable();
        }
    }

    function toggleMobileMenu(force) {
        State.mobileMenuOpen = force !== undefined ? force : !State.mobileMenuOpen;
        $('#mobile-menu').classList.toggle('hidden', !State.mobileMenuOpen);
    }

    // ─── Workers ───
    function createWorker(name, id = null) {
        if (!id) {
            State.workerCounter++;
            id = `worker-${State.workerCounter}`;
        } else {
            const num = parseInt(id.split('-')[1]);
            if (num > State.workerCounter) State.workerCounter = num;
        }

        const el = document.createElement('div');
        el.id = id;
        el.className = 'worker-item bg-white border border-surface-200 p-2 rounded-lg hover:border-brand-400 hover:shadow-sm flex items-center justify-between text-xs font-semibold relative group';
        el.setAttribute('data-name', name);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'worker-name-text truncate px-1';
        nameSpan.textContent = name; // textContent for XSS safety

        const btn = document.createElement('button');
        btn.className = 'action-btn text-surface-300 hover:text-red-500 transition-all p-1';
        btn.title = '未配置に戻す / 削除';
        btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`;
        btn.addEventListener('click', (ev) => { ev.stopPropagation(); handleWorkerAction(id); });

        el.appendChild(nameSpan);
        el.appendChild(btn);

        // Click to select
        el.addEventListener('click', toggleSelect);

        const pool = getActivePool();
        pool.appendChild(el);
        updateTotalCount();
        return el;
    }

    function getActivePool() {
        if (State.isMobile && State.drawerOpen) return $('#worker-pool-mobile') || $('#worker-pool');
        return $('#worker-pool');
    }

    function getAllPoolElements() {
        const pool1 = $('#worker-pool');
        const pool2 = $('#worker-pool-mobile');
        const items = [];
        if (pool1) items.push(...pool1.querySelectorAll('.worker-item'));
        if (pool2) items.push(...pool2.querySelectorAll('.worker-item'));
        return items;
    }

    function handleWorkerAction(id) {
        const el = document.getElementById(id);
        if (!el) return;
        const name = el.querySelector('.worker-name-text').textContent.trim();
        const pool = getActivePool();

        if (el.parentElement === pool || el.parentElement === $('#worker-pool') || el.parentElement === $('#worker-pool-mobile')) {
            el.remove();
            showToast(`「${name}」を削除しました`);
        } else {
            el.classList.remove('selected');
            pool.appendChild(el);
            showToast(`「${name}」を未配置に戻しました`);
        }
        updateCounts();
        updateTotalCount();
        updateSelectedStatus();
    }

    function addNewWorkerFromInput(inputId) {
        const input = document.getElementById(inputId);
        const name = input.value.trim();
        if (name) {
            createWorker(name);
            input.value = '';
            showToast(`「${name}」を追加`);
            updateCounts();
        }
    }

    function updateTotalCount() {
        const total = $$('.worker-item').length;
        $('#total-worker-count').textContent = total;
    }

    // ─── Areas ───
    function addMainArea(defaultName = '新規エリア', color = null, subNames = null, id = null) {
        if (!id) {
            State.mainAreaCounter++;
            id = `main-area-${State.mainAreaCounter}`;
        } else {
            const num = parseInt(id.split('-').pop());
            if (num > State.mainAreaCounter) State.mainAreaCounter = num;
        }

        const areaColor = color || COLORS[Math.floor(Math.random() * COLORS.length)];
        const container = $('#main-areas-container');
        const card = document.createElement('div');
        card.id = id;
        card.className = 'area-card bg-white rounded-xl shadow-sm border border-surface-200 flex flex-col overflow-hidden group relative';
        card.style.minHeight = '380px';
        card.setAttribute('data-color', areaColor);

        const num = id.split('-').pop();

        card.innerHTML = `
            <div class="area-header px-3 md:px-4 py-2.5 flex justify-between items-center">
                <h3 class="font-bold area-title flex items-center text-sm md:text-base">
                    <span class="area-badge-num w-6 h-6 rounded-md text-white flex items-center justify-center mr-2 text-[10px] select-none uppercase font-black tracking-tighter shrink-0">${num}</span>
                    <span class="editable-title" contenteditable="true" spellcheck="false">${escapeHtml(defaultName)}</span>
                </h3>
                <div class="flex items-center space-x-2">
                    <span class="area-count text-xs font-bold bg-white px-2 py-0.5 rounded-md border shadow-sm select-none count-badge parent-count" data-parent="${id}">0名</span>
                    <button class="action-btn text-surface-300 hover:text-red-500 transition-colors" title="エリア削除">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="p-2 md:p-3 grid grid-cols-2 gap-2 md:gap-3 flex-1 sub-areas-grid"></div>
            <button class="add-sub-btn m-2 md:m-3 mt-0 py-2 border-2 border-dashed border-surface-200 rounded-lg text-surface-300 hover:text-brand-500 hover:border-brand-300 hover:bg-brand-50/50 transition-all text-xs font-bold flex justify-center items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                作業項目を追加
            </button>
        `;

        // Event listeners (no inline handlers)
        card.querySelector('.action-btn[title="エリア削除"]').addEventListener('click', () => openConfirmModal(id));
        card.querySelector('.add-sub-btn').addEventListener('click', () => addSubArea(id));
        card.querySelector('.editable-title').addEventListener('keydown', handleTitleKey);

        container.appendChild(card);

        if (subNames && subNames.length > 0) {
            subNames.forEach(name => addSubArea(id, name));
        } else {
            addSubArea(id, '新規作業項目');
        }
        updateCounts();
        return card;
    }

    function addSubArea(parentMainId, name = '新規作業項目', id = null) {
        const mainCard = document.getElementById(parentMainId);
        if (!mainCard) return;
        const grid = mainCard.querySelector('.sub-areas-grid');
        const subId = id || `sub-area-${Date.now()}-${Math.floor(Math.random() * 1000)}`;

        const wrapper = document.createElement('div');
        wrapper.id = subId;
        wrapper.className = 'flex flex-col group/sub relative';

        wrapper.innerHTML = `
            <div class="flex justify-between items-center mb-1 px-1">
                <span class="text-[11px] font-bold text-surface-500 flex items-center">
                    <span class="editable-title" contenteditable="true" spellcheck="false">${escapeHtml(name)}</span>
                </span>
                <div class="flex items-center space-x-1">
                    <span class="text-[10px] font-bold text-surface-400 sub-count-label select-none count-badge">0名</span>
                    <button class="action-btn text-surface-300 hover:text-red-500 transition-colors" title="作業項目削除">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="drop-zone flex-1 bg-surface-50/50 border-2 border-dashed border-surface-200 rounded-lg p-1.5 md:p-2 flex flex-wrap content-start gap-1 md:gap-1.5 transition-colors"></div>
        `;

        wrapper.querySelector('.editable-title').addEventListener('keydown', handleTitleKey);
        wrapper.querySelector('.action-btn[title="作業項目削除"]').addEventListener('click', () => openConfirmModal(subId));

        grid.appendChild(wrapper);
        initDropZoneSortable(wrapper.querySelector('.drop-zone'));
        updateCounts();
        return wrapper;
    }

    // ─── SortableJS Integration ───
    function initPoolSortable() {
        // Destroy old instances for pools
        State.sortableInstances = State.sortableInstances.filter(s => {
            if (s.el.id === 'worker-pool' || s.el.id === 'worker-pool-mobile') {
                s.destroy();
                return false;
            }
            return true;
        });

        ['worker-pool', 'worker-pool-mobile'].forEach(poolId => {
            const pool = document.getElementById(poolId);
            if (pool) {
                const s = Sortable.create(pool, {
                    group: 'workers',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    dragClass: 'sortable-drag',
                    delay: State.isMobile ? 150 : 0,
                    delayOnTouchOnly: true,
                    touchStartThreshold: 5,
                    fallbackOnBody: true,
                    swapThreshold: 0.65,
                    onEnd: () => { updateCounts(); updateSelectedStatus(); },
                });
                State.sortableInstances.push(s);
            }
        });
    }

    function initDropZoneSortable(zone) {
        if (!zone) return;
        const s = Sortable.create(zone, {
            group: 'workers',
            animation: 150,
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            dragClass: 'sortable-drag',
            delay: State.isMobile ? 150 : 0,
            delayOnTouchOnly: true,
            touchStartThreshold: 5,
            fallbackOnBody: true,
            swapThreshold: 0.65,
            onEnd: () => { updateCounts(); updateSelectedStatus(); },
        });
        State.sortableInstances.push(s);
    }

    // ─── Save / Load ───
    function saveDashboardState() {
        const state = { workers: [], areas: [] };

        $$('.worker-item').forEach(el => {
            state.workers.push({
                id: el.id,
                name: el.querySelector('.worker-name-text').textContent,
                parentId: el.parentElement.id || 'worker-pool'
            });
        });

        $$('[id^="main-area-"]').forEach(mainEl => {
            const subAreas = [];
            mainEl.querySelectorAll('[id^="sub-area-"]').forEach(subEl => {
                subAreas.push({
                    id: subEl.id,
                    name: subEl.querySelector('.editable-title').textContent
                });
            });
            state.areas.push({
                id: mainEl.id,
                name: mainEl.querySelector('.editable-title').textContent,
                color: mainEl.getAttribute('data-color'),
                subAreas
            });
        });

        localStorage.setItem('dashboard_save_data_v2', JSON.stringify(state));
        showToast('保存しました', true);
    }

    function loadDashboardState() {
        const data = localStorage.getItem('dashboard_save_data_v2');
        if (!data) return false;
        try {
            const state = JSON.parse(data);
            $('#worker-pool').innerHTML = '';
            $('#main-areas-container').innerHTML = '';

            state.areas.forEach(main => {
                addMainArea(main.name, main.color, [], main.id);
                main.subAreas.forEach(sub => addSubArea(main.id, sub.name, sub.id));
            });

            state.workers.forEach(w => {
                const el = createWorker(w.name, w.id);
                // Find correct drop zone
                let parent = document.getElementById(w.parentId);
                if (parent && parent.classList.contains('drop-zone')) {
                    parent.appendChild(el);
                } else if (parent) {
                    const zone = parent.querySelector('.drop-zone');
                    if (zone) zone.appendChild(el);
                }
                // else stays in pool
            });

            return true;
        } catch (e) {
            console.error('Failed to load state:', e);
            return false;
        }
    }

    // ─── CSV Export ───
    function exportToCSV() {
        const rows = [['作業員名', '配置エリア', '作業項目']];

        $$('.worker-item').forEach(worker => {
            const name = worker.querySelector('.worker-name-text').textContent;
            let areaName = '未配置', taskName = '-';

            if (worker.parentElement.id !== 'worker-pool' && worker.parentElement.id !== 'worker-pool-mobile') {
                const subArea = worker.closest('[id^="sub-area-"]');
                const mainArea = worker.closest('[id^="main-area-"]');
                if (subArea) taskName = subArea.querySelector('.editable-title').textContent;
                if (mainArea) areaName = mainArea.querySelector('.editable-title').textContent;
            }
            rows.push([csvEscape(name), csvEscape(areaName), csvEscape(taskName)]);
        });

        const bom = '\uFEFF';
        const csvContent = bom + rows.map(r => r.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        link.href = url;
        link.download = `作業員配置リスト_${dateStr}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('CSVを出力しました', true);
    }

    function csvEscape(str) {
        if (str.includes(',') || str.includes('"') || str.includes('\n')) {
            return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
    }

    // ─── Selection (desktop) ───
    function startMarquee(ev) {
        if (State.isMobile) return;
        if (ev.target.closest('.worker-item') || ev.target.closest('input') || ev.target.closest('button') || ev.target.closest('.editable-title')) return;
        State.isDraggingMarquee = true;
        State.marqueeStart = { x: ev.clientX, y: ev.clientY };
        if (!ev.shiftKey) clearAllSelections();
        marquee.style.display = 'block';
    }

    function moveMarquee(ev) {
        if (!State.isDraggingMarquee) return;
        const left = Math.min(State.marqueeStart.x, ev.clientX);
        const top = Math.min(State.marqueeStart.y, ev.clientY);
        const width = Math.abs(State.marqueeStart.x - ev.clientX);
        const height = Math.abs(State.marqueeStart.y - ev.clientY);
        Object.assign(marquee.style, { left: left+'px', top: top+'px', width: width+'px', height: height+'px' });
        checkIntersections({ left, top, right: left + width, bottom: top + height });
    }

    function endMarquee() {
        State.isDraggingMarquee = false;
        marquee.style.display = 'none';
    }

    function checkIntersections(rect) {
        $$('.worker-item').forEach(worker => {
            const wRect = worker.getBoundingClientRect();
            const isOverlap = !(rect.right < wRect.left || rect.left > wRect.right || rect.bottom < wRect.top || rect.top > wRect.bottom);
            if (isOverlap && worker.style.display !== 'none') worker.classList.add('selected');
        });
        updateSelectedStatus();
    }

    function toggleSelect(ev) {
        ev.stopPropagation();
        const item = ev.currentTarget;
        if (ev.shiftKey || ev.ctrlKey || ev.metaKey) {
            item.classList.toggle('selected');
        } else {
            const wasSelected = item.classList.contains('selected');
            clearAllSelections();
            if (!wasSelected) item.classList.add('selected');
        }
        updateSelectedStatus();
    }

    function clearAllSelections() {
        $$('.worker-item.selected').forEach(el => el.classList.remove('selected'));
        updateSelectedStatus();
    }

    function updateSelectedStatus() {
        const count = $$('.worker-item.selected').length;
        const badge = $('#selected-count');
        const badgeMobile = $('#selected-count-mobile');
        if (count > 0) {
            const txt = `${count}名選択`;
            badge.textContent = txt; badge.classList.remove('hidden');
            if (badgeMobile) { badgeMobile.textContent = txt; badgeMobile.classList.remove('hidden'); }
        } else {
            badge.classList.add('hidden');
            if (badgeMobile) badgeMobile.classList.add('hidden');
        }
    }

    // ─── Modals / UI ───
    function openConfirmModal(id) {
        State.areaToDelete = id;
        const modal = $('#confirm-modal');
        const desc = $('#modal-desc');
        desc.textContent = id.startsWith('main-area')
            ? 'エリア全体を削除します。配置済みの作業員は未配置リストに戻ります。'
            : 'この作業項目を削除します。配置済みの作業員は未配置リストに戻ります。';
        modal.style.display = 'flex';
        $('#modal-confirm-btn').onclick = () => {
            deleteArea(State.areaToDelete);
            closeConfirmModal();
        };
    }

    function closeConfirmModal() {
        $('#confirm-modal').style.display = 'none';
        State.areaToDelete = null;
    }

    function deleteArea(areaId) {
        const el = document.getElementById(areaId);
        if (!el) return;
        const pool = getActivePool();
        el.querySelectorAll('.worker-item').forEach(w => {
            w.classList.remove('selected');
            pool.appendChild(w);
        });
        // Destroy sortable instances for this area
        State.sortableInstances = State.sortableInstances.filter(s => {
            if (el.contains(s.el)) { s.destroy(); return false; }
            return true;
        });
        el.remove();
        updateCounts();
        showToast('削除しました');
    }

    function handleTitleKey(e) {
        if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
    }

    // ─── Counts ───
    function updateCounts() {
        $$('.drop-zone').forEach(zone => {
            const count = zone.querySelectorAll('.worker-item').length;
            const container = zone.closest('.flex-col');
            if (container) {
                const label = container.querySelector('.sub-count-label');
                if (label) label.textContent = `${count}名`;
            }
        });

        $$('[id^="main-area-"]').forEach(card => {
            const count = card.querySelectorAll('.worker-item').length;
            const badge = card.querySelector('.parent-count');
            if (badge) badge.textContent = `${count}名`;
        });

        const poolCount = ($$('#worker-pool .worker-item').length) + ($$('#worker-pool-mobile .worker-item').length);
        $$('.pool-count').forEach(el => el.textContent = poolCount);
        updateTotalCount();
    }

    function filterWorkers(query) {
        const lowerQuery = query.toLowerCase();
        getAllPoolElements().forEach(item => {
            const name = (item.getAttribute('data-name') || '').toLowerCase();
            item.style.display = name.includes(lowerQuery) ? 'flex' : 'none';
        });
        // Also filter desktop pool
        $$('#worker-pool .worker-item').forEach(item => {
            const name = (item.getAttribute('data-name') || '').toLowerCase();
            item.style.display = name.includes(lowerQuery) ? 'flex' : 'none';
        });
    }

    // ─── Helpers ───
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function showToast(msg, isSuccess = true) {
        const container = $('#toast-container');
        $('#toast-text').textContent = msg;
        container.classList.add('visible');
        clearTimeout(showToast._timeout);
        showToast._timeout = setTimeout(() => container.classList.remove('visible'), 2500);
    }
    </script>
</body>
