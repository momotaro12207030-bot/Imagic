<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音声認識アプリ - Web Speech API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 24px;
    text-align: center;
    background: linear-gradient(135deg, #1e293b, #334155);
    border-bottom: 1px solid #475569;
  }
  header h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 4px;
  }

  .container {
    width: 100%;
    max-width: 720px;
    padding: 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .controls select, .controls button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .controls select:hover, .controls button:hover {
    background: #334155;
    border-color: #64748b;
  }
  .controls select:focus, .controls button:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
  }

  /* Mic button */
  .mic-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 32px 0;
  }

  .mic-btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 3px solid #475569;
    background: #1e293b;
    color: #94a3b8;
    font-size: 40px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .mic-btn:hover {
    border-color: #38bdf8;
    color: #38bdf8;
    transform: scale(1.05);
  }
  .mic-btn.recording {
    border-color: #ef4444;
    color: #ef4444;
    animation: pulse 1.5s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
    50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.5); }
  }

  .status {
    font-size: 14px;
    color: #94a3b8;
    min-height: 20px;
  }
  .status.recording {
    color: #ef4444;
    font-weight: 600;
  }

  /* Interim text */
  .interim {
    min-height: 48px;
    padding: 12px 16px;
    background: #1e293b;
    border: 1px dashed #475569;
    border-radius: 8px;
    font-size: 16px;
    color: #64748b;
    font-style: italic;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Transcript */
  .transcript-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .transcript-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: #cbd5e1;
  }
  .transcript-actions {
    display: flex;
    gap: 8px;
  }
  .transcript-actions button {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .transcript-actions button:hover {
    background: #334155;
    color: #e2e8f0;
  }

  .transcript {
    flex: 1;
    min-height: 200px;
    max-height: 400px;
    overflow-y: auto;
    padding: 16px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .transcript:empty::before {
    content: '音声認識の結果がここに表示されます...';
    color: #475569;
  }
  .transcript .entry {
    padding: 8px 0;
    border-bottom: 1px solid rgba(71, 85, 105, 0.3);
  }
  .transcript .entry:last-child {
    border-bottom: none;
  }
  .transcript .timestamp {
    font-size: 11px;
    color: #64748b;
    margin-right: 8px;
  }
  .transcript .confidence {
    font-size: 11px;
    color: #475569;
    margin-left: 4px;
  }
  .transcript .confidence.high { color: #22c55e; }
  .transcript .confidence.medium { color: #eab308; }
  .transcript .confidence.low { color: #ef4444; }

  /* Scrollbar */
  .transcript::-webkit-scrollbar { width: 6px; }
  .transcript::-webkit-scrollbar-track { background: transparent; }
  .transcript::-webkit-scrollbar-thumb {
    background: #475569;
    border-radius: 3px;
  }

  /* Unsupported banner */
  .unsupported {
    padding: 20px;
    background: #451a03;
    border: 1px solid #92400e;
    border-radius: 8px;
    text-align: center;
    color: #fbbf24;
    font-size: 14px;
    line-height: 1.6;
  }

  /* Footer */
  footer {
    padding: 16px;
    text-align: center;
    font-size: 11px;
    color: #475569;
  }
</style>
</head>
<body>

<header>
  <h1>Web Speech API 音声認識</h1>
  <p>ブラウザのWeb Speech APIを使ったリアルタイム音声認識アプリ</p>
</header>

<div class="container" id="app">
  <!-- Filled by JS based on browser support -->
</div>

<footer>
  Web Speech API | Chrome / Edge 推奨
</footer>

<script>
const app = document.getElementById('app');

// Check browser support
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  app.innerHTML = `
    <div class="unsupported">
      <p>お使いのブラウザはWeb Speech APIに対応していません。</p>
      <p>Google Chrome または Microsoft Edge の最新版をご利用ください。</p>
    </div>`;
} else {
  init();
}

function init() {
  // Build UI
  app.innerHTML = `
    <div class="controls">
      <select id="langSelect">
        <option value="ja-JP">日本語</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="zh-CN">中文 (简体)</option>
        <option value="zh-TW">中文 (繁體)</option>
        <option value="ko-KR">한국어</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="es-ES">Español</option>
        <option value="pt-BR">Português</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#94a3b8;cursor:pointer;">
        <input type="checkbox" id="continuousCheck" checked> 連続認識
      </label>
    </div>

    <div class="mic-section">
      <button class="mic-btn" id="micBtn" title="録音開始 / 停止">&#x1F3A4;</button>
      <div class="status" id="status">マイクボタンを押して開始</div>
    </div>

    <div class="interim" id="interim"></div>

    <div class="transcript-header">
      <h2>認識結果</h2>
      <div class="transcript-actions">
        <button id="copyBtn" title="テキストをコピー">コピー</button>
        <button id="downloadBtn" title="テキストファイルとして保存">保存</button>
        <button id="clearBtn" title="認識結果をクリア">クリア</button>
      </div>
    </div>
    <div class="transcript" id="transcript"></div>
  `;

  // Elements
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const interimEl = document.getElementById('interim');
  const transcriptEl = document.getElementById('transcript');
  const langSelect = document.getElementById('langSelect');
  const continuousCheck = document.getElementById('continuousCheck');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');

  let recognition = null;
  let isRecording = false;
  let entries = [];

  function createRecognition() {
    const rec = new SpeechRecognition();
    rec.lang = langSelect.value;
    rec.continuous = continuousCheck.checked;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      statusEl.textContent = '認識中...';
      statusEl.classList.add('recording');
    };

    rec.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (result.isFinal) {
          const text = result[0].transcript;
          const confidence = result[0].confidence;
          addEntry(text, confidence);
          interimEl.textContent = '';
        } else {
          interim += result[0].transcript;
        }
      }
      if (interim) {
        interimEl.textContent = interim;
      }
    };

    rec.onerror = (event) => {
      console.error('Speech recognition error:', event.error);
      if (event.error === 'no-speech') {
        statusEl.textContent = '音声が検出されませんでした。もう一度お試しください。';
      } else if (event.error === 'audio-capture') {
        statusEl.textContent = 'マイクが見つかりません。マイクを接続してください。';
      } else if (event.error === 'not-allowed') {
        statusEl.textContent = 'マイクの使用が許可されていません。ブラウザの設定を確認してください。';
      } else {
        statusEl.textContent = `エラー: ${event.error}`;
      }
      statusEl.classList.remove('recording');
    };

    rec.onend = () => {
      // If continuous mode and still recording, restart
      if (isRecording && continuousCheck.checked) {
        try {
          rec.start();
          return;
        } catch (e) {
          // fall through to stop
        }
      }
      isRecording = false;
      micBtn.classList.remove('recording');
      statusEl.textContent = 'マイクボタンを押して開始';
      statusEl.classList.remove('recording');
      interimEl.textContent = '';
    };

    return rec;
  }

  function addEntry(text, confidence) {
    const now = new Date();
    const ts = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const confPercent = Math.round(confidence * 100);
    let confClass = 'high';
    if (confPercent < 70) confClass = 'low';
    else if (confPercent < 90) confClass = 'medium';

    const entry = { text, confidence: confPercent, timestamp: ts };
    entries.push(entry);

    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `<span class="timestamp">${ts}</span>${escapeHtml(text)}<span class="confidence ${confClass}">(${confPercent}%)</span>`;
    transcriptEl.appendChild(div);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function toggleRecording() {
    if (isRecording) {
      isRecording = false;
      if (recognition) {
        recognition.stop();
      }
    } else {
      recognition = createRecognition();
      try {
        recognition.start();
      } catch (e) {
        statusEl.textContent = 'エラー: 認識を開始できませんでした。';
      }
    }
  }

  // Event listeners
  micBtn.addEventListener('click', toggleRecording);

  langSelect.addEventListener('change', () => {
    if (isRecording) {
      isRecording = false;
      if (recognition) recognition.stop();
      setTimeout(() => {
        toggleRecording();
      }, 300);
    }
  });

  copyBtn.addEventListener('click', () => {
    const text = entries.map(e => e.text).join('\n');
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'コピー済';
      setTimeout(() => { copyBtn.textContent = 'コピー'; }, 1500);
    });
  });

  downloadBtn.addEventListener('click', () => {
    const lines = entries.map(e => `[${e.timestamp}] ${e.text} (${e.confidence}%)`);
    const text = lines.join('\n');
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain; charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `speech_${new Date().toISOString().slice(0, 10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });

  clearBtn.addEventListener('click', () => {
    entries = [];
    transcriptEl.innerHTML = '';
    interimEl.textContent = '';
  });

  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      toggleRecording();
    }
  });
}
</script>
</body>
</html>
