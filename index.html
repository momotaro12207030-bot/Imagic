<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YABAME - 3D Racing</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at 50% 20%, #172554 0%, #020617 55%, #01030b 100%);
    }
    #game {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      color: #e2e8f0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
    .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .pill {
      background: rgba(15, 23, 42, 0.56);
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 8px 12px;
      border-radius: 999px;
      backdrop-filter: blur(2px);
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .title {
      text-align: center;
      font-size: clamp(24px, 4vw, 56px);
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #7dd3fc;
      margin-top: 4vh;
    }
    .hint {
      text-align: center;
      margin-bottom: 2vh;
      font-size: clamp(12px, 1.8vw, 16px);
      opacity: 0.85;
    }
    .bar {
      width: min(360px, 72vw);
      height: 14px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.7);
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #22d3ee, #34d399);
      transform-origin: left center;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="row">
      <div class="pill" id="speed">SPEED 0 km/h</div>
      <div class="pill" id="score">SCORE 0</div>
      <div class="pill" id="best">BEST 0</div>
    </div>

    <div class="title">YABAME</div>

    <div class="row" style="align-items: flex-end;">
      <div>
        <div class="pill" style="margin-bottom:8px;">BOOST</div>
        <div class="bar"><div class="bar-fill" id="boostBar"></div></div>
      </div>
      <div class="hint" id="hint">←→ / A,D: ハンドル &nbsp; ↑ / W: 加速 &nbsp; ↓ / S: 減速 &nbsp; Shift: ブースト</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const boostBar = document.getElementById('boostBar');
    const hintEl = document.getElementById('hint');

    const keys = Object.create(null);
    const world = {
      roadX: 0,
      curve: 0,
      segmentLength: 90,
      laneWidth: 220,
      baseRoadWidth: 2600,
      maxSpeed: 280,
      accel: 118,
      brake: 162,
      friction: 42,
      speed: 0,
      distance: 0,
      score: 0,
      boost: 1,
      playerOffset: 0,
      wobble: 0,
      dead: false,
      restartTimer: 0,
      best: Number(localStorage.getItem('yabame-best') || 0),
      obstacles: [],
      stars: []
    };

    let width = 0;
    let height = 0;
    let roadHorizon = 0;
    let lastTime = performance.now();

    const rand = (min, max) => Math.random() * (max - min) + min;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      roadHorizon = height * 0.34;
      createStars();
    }

    function createStars() {
      world.stars = Array.from({ length: 180 }, () => ({
        x: Math.random() * width,
        y: Math.random() * roadHorizon,
        z: rand(0.3, 1),
      }));
    }

    function spawnObstacle(z = world.distance + rand(800, 2600)) {
      const lane = Math.round(rand(-1.4, 1.4));
      world.obstacles.push({ z, lane, w: rand(120, 150), h: rand(80, 110) });
    }

    function initTrack() {
      world.obstacles = [];
      for (let i = 0; i < 24; i++) spawnObstacle(world.distance + 700 + i * rand(500, 1100));
    }

    function resetRun() {
      world.speed = 0;
      world.playerOffset = 0;
      world.distance = 0;
      world.score = 0;
      world.curve = 0;
      world.dead = false;
      world.restartTimer = 0;
      world.boost = 1;
      hintEl.textContent = '←→ / A,D: ハンドル   ↑ / W: 加速   ↓ / S: 減速   Shift: ブースト';
      initTrack();
    }

    function update(dt) {
      if (world.dead) {
        world.restartTimer -= dt;
        if (world.restartTimer <= 0 && (keys.Enter || keys[' '])) {
          resetRun();
        }
        return;
      }

      const accelerating = keys.ArrowUp || keys.w;
      const braking = keys.ArrowDown || keys.s;
      const left = keys.ArrowLeft || keys.a;
      const right = keys.ArrowRight || keys.d;
      const boosting = (keys.Shift || keys.ShiftLeft || keys.ShiftRight) && world.boost > 0.02 && world.speed > 120;

      if (accelerating) world.speed += world.accel * dt;
      if (braking) world.speed -= world.brake * dt;
      world.speed -= world.friction * dt;
      world.speed = Math.max(0, Math.min(world.maxSpeed, world.speed));

      if (boosting) {
        world.speed = Math.min(world.maxSpeed * 1.25, world.speed + 180 * dt);
        world.boost = Math.max(0, world.boost - dt * 0.33);
      } else {
        world.boost = Math.min(1, world.boost + dt * 0.12);
      }

      const steerPower = (world.speed / world.maxSpeed) * 2.2;
      if (left) world.playerOffset -= dt * steerPower;
      if (right) world.playerOffset += dt * steerPower;

      world.curve += Math.sin(world.distance * 0.0007) * 0.00065;
      world.playerOffset -= world.curve * dt * 4.2;
      world.playerOffset = Math.max(-1.65, Math.min(1.65, world.playerOffset));

      world.distance += world.speed * dt * world.segmentLength;
      world.score += world.speed * dt * (boosting ? 2.2 : 1.2);
      world.wobble += dt * (2.8 + world.speed * 0.013);

      if (world.playerOffset <= -1.62 || world.playerOffset >= 1.62) crash('コースアウト！ Enter / Space でリトライ');

      for (const obs of world.obstacles) {
        if (obs.z < world.distance - 120) {
          obs.z = world.distance + rand(1800, 4200);
          obs.lane = Math.round(rand(-1.4, 1.4));
          continue;
        }
        const dz = obs.z - world.distance;
        if (dz > 30 && dz < 140) {
          const laneDiff = Math.abs(world.playerOffset - obs.lane * 0.62);
          if (laneDiff < 0.28) {
            crash('クラッシュ！ Enter / Space でリトライ');
            break;
          }
        }
      }

      if (world.score > world.best) {
        world.best = Math.floor(world.score);
        localStorage.setItem('yabame-best', String(world.best));
      }
    }

    function crash(message) {
      world.dead = true;
      world.speed *= 0.15;
      world.restartTimer = 0.4;
      hintEl.textContent = message;
    }

    function drawSky() {
      const grad = ctx.createLinearGradient(0, 0, 0, roadHorizon);
      grad.addColorStop(0, '#1d4ed8');
      grad.addColorStop(0.6, '#0f172a');
      grad.addColorStop(1, '#030712');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, roadHorizon);

      for (const star of world.stars) {
        const tw = 0.4 + Math.sin(world.wobble * star.z * 2 + star.x * 0.01) * 0.35;
        ctx.fillStyle = `rgba(226,232,240,${Math.max(0.1, tw)})`;
        ctx.fillRect(star.x, star.y, 1.5 * star.z, 1.5 * star.z);
      }

      for (let i = 0; i < 3; i++) {
        const mx = ((i * 0.37 + world.distance * 0.00001) % 1) * width;
        const my = roadHorizon - 70 - i * 28;
        ctx.fillStyle = 'rgba(56,189,248,0.08)';
        ctx.beginPath();
        ctx.ellipse(mx, my, 140 + i * 35, 24 + i * 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function project(z) {
      const depth = z / world.segmentLength;
      const perspective = 1 / depth;
      const y = roadHorizon + (1 - perspective) * (height - roadHorizon);
      const roadWidth = world.baseRoadWidth * perspective;
      return { perspective, y, roadWidth };
    }

    function drawRoad() {
      ctx.fillStyle = '#0b1022';
      ctx.fillRect(0, roadHorizon, width, height - roadHorizon);

      const visibleSegments = 220;
      for (let i = visibleSegments; i > 2; i--) {
        const z1 = i * world.segmentLength;
        const z2 = (i - 1) * world.segmentLength;
        const p1 = project(z1);
        const p2 = project(z2);

        const bend1 = (Math.sin((world.distance + z1) * 0.00055) + world.curve * 48) * p1.perspective * 390;
        const bend2 = (Math.sin((world.distance + z2) * 0.00055) + world.curve * 48) * p2.perspective * 390;

        const center1 = width * 0.5 + bend1 - world.playerOffset * p1.perspective * 420;
        const center2 = width * 0.5 + bend2 - world.playerOffset * p2.perspective * 420;

        const rumble = i % 2 === 0 ? '#dc2626' : '#f8fafc';
        const asphalt = i % 2 === 0 ? '#111827' : '#0f172a';

        drawQuad(center1, p1.y, p1.roadWidth * 0.57, center2, p2.y, p2.roadWidth * 0.57, '#14532d');
        drawQuad(center1, p1.y, p1.roadWidth * 0.5, center2, p2.y, p2.roadWidth * 0.5, rumble);
        drawQuad(center1, p1.y, p1.roadWidth * 0.44, center2, p2.y, p2.roadWidth * 0.44, asphalt);

        if (i % 10 < 5) {
          drawQuad(center1, p1.y, p1.roadWidth * 0.03, center2, p2.y, p2.roadWidth * 0.03, '#f8fafc');
        }
      }

      for (const obs of world.obstacles) {
        const dz = obs.z - world.distance;
        if (dz < 20 || dz > visibleSegments * world.segmentLength) continue;
        const p = project(dz);
        const bend = (Math.sin((world.distance + dz) * 0.00055) + world.curve * 48) * p.perspective * 390;
        const center = width * 0.5 + bend - world.playerOffset * p.perspective * 420;
        const x = center + obs.lane * p.roadWidth * 0.19;
        const w = obs.w * p.perspective;
        const h = obs.h * p.perspective;

        ctx.fillStyle = '#f97316';
        ctx.fillRect(x - w * 0.5, p.y - h, w, h);
        ctx.fillStyle = '#111827';
        ctx.fillRect(x - w * 0.35, p.y - h * 0.7, w * 0.7, h * 0.25);
      }
    }

    function drawQuad(cx1, y1, hw1, cx2, y2, hw2, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx1 - hw1, y1);
      ctx.lineTo(cx1 + hw1, y1);
      ctx.lineTo(cx2 + hw2, y2);
      ctx.lineTo(cx2 - hw2, y2);
      ctx.closePath();
      ctx.fill();
    }

    function drawCar() {
      const x = width * 0.5 + world.playerOffset * width * 0.18;
      const y = height * 0.84 + Math.sin(world.wobble * 12) * 2;
      const boostGlow = world.speed > world.maxSpeed ? 1 : 0;

      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = 'rgba(34, 211, 238, 0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 18, 58 + boostGlow * 18, 20 + boostGlow * 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-34, -18, 68, 40);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(-28, -13, 56, 24);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(-20, -8, 40, 12);
      ctx.fillStyle = '#111827';
      ctx.fillRect(-34, 4, 68, 10);

      if (world.speed > 80) {
        const flameLen = 8 + (world.speed / world.maxSpeed) * 22;
        ctx.fillStyle = 'rgba(56,189,248,0.9)';
        ctx.beginPath();
        ctx.moveTo(-16, 22);
        ctx.lineTo(-6, 22 + flameLen);
        ctx.lineTo(0, 22);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(16, 22);
        ctx.lineTo(6, 22 + flameLen);
        ctx.lineTo(0, 22);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function render() {
      drawSky();
      drawRoad();
      drawCar();

      speedEl.textContent = `SPEED ${Math.floor(world.speed)} km/h`;
      scoreEl.textContent = `SCORE ${Math.floor(world.score)}`;
      bestEl.textContent = `BEST ${world.best}`;
      boostBar.style.transform = `scaleX(${world.boost})`;
    }

    function tick(now) {
      const dt = Math.min(0.035, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(tick);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    window.addEventListener('resize', resize);

    resize();
    resetRun();
    requestAnimationFrame((t) => {
      lastTime = t;
      tick(t);
    });
  </script>
</body>
</html>
