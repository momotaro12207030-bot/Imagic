<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像容量分析＆圧縮ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.3s ease; }
        .drop-zone.drag-over { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<div class="max-w-5xl mx-auto px-4 py-8">
    <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-slate-900 mb-2">画像容量分析＆圧縮ツール</h1>
        <p class="text-slate-600">画像のファイルサイズ（MB/KB）を分析し、最適に圧縮します。</p>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- 左側：入力と設定 -->
        <div class="lg:col-span-5 space-y-6">
            <!-- アップロードエリア -->
            <div id="dropZone" class="drop-zone bg-white rounded-2xl p-8 text-center cursor-pointer hover:bg-slate-50">
                <input type="file" id="fileInput" class="hidden" accept="image/*">
                <div class="flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p class="text-lg font-medium">クリックして選択、またはドラッグ＆ドロップ</p>
                    <p class="text-sm text-slate-500 mt-1">JPEG, PNG, WebP 対応</p>
                </div>
            </div>

            <!-- 設定パネル -->
            <div id="settingsPanel" class="bg-white rounded-2xl p-6 shadow-sm hidden">
                <h2 class="text-lg font-bold mb-4 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                    </svg>
                    圧縮設定
                </h2>
                
                <div class="space-y-6">
                    <!-- 品質 -->
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm font-semibold">品質 (Quality)</label>
                            <span id="qualityValue" class="text-sm text-blue-600 font-bold">80%</span>
                        </div>
                        <input type="range" id="qualityRange" min="1" max="100" value="80" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>

                    <!-- リサイズ -->
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm font-semibold">幅のリサイズ (Width px)</label>
                            <span id="widthValue" class="text-sm text-blue-600 font-bold">Original</span>
                        </div>
                        <input type="range" id="widthRange" min="100" max="4000" step="10" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>

                    <!-- フォーマット -->
                    <div>
                        <label class="text-sm font-semibold block mb-2">出力形式</label>
                        <select id="formatSelect" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="image/jpeg">JPEG (写真に最適)</option>
                            <option value="image/webp">WebP (高圧縮率)</option>
                            <option value="image/png">PNG (透過維持・非圧縮)</option>
                        </select>
                    </div>

                    <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-colors flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        圧縮画像を保存
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側：結果表示 -->
        <div class="lg:col-span-7 space-y-6">
            <!-- 分析レポート -->
            <div id="analysisReport" class="bg-white rounded-2xl p-6 shadow-sm hidden">
                <h2 class="text-lg font-bold mb-4">分析レポート</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="bg-slate-50 p-3 rounded-xl">
                        <p class="text-[10px] uppercase text-slate-500 font-bold mb-1">元のサイズ</p>
                        <p id="originalSize" class="text-base font-bold text-slate-700">-</p>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                        <p class="text-[10px] uppercase text-blue-500 font-bold mb-1">圧縮後</p>
                        <p id="compressedSize" class="text-base font-bold text-blue-700">-</p>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                        <p class="text-[10px] uppercase text-emerald-500 font-bold mb-1">削減量</p>
                        <p id="savedSize" class="text-base font-bold text-emerald-700">-</p>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                        <p class="text-[10px] uppercase text-emerald-500 font-bold mb-1">削減率</p>
                        <p id="reductionRate" class="text-base font-bold text-emerald-700">-</p>
                    </div>
                </div>
                
                <!-- プレビュー比較 -->
                <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <p class="text-xs font-bold text-slate-500 mb-2 text-center">オリジナル</p>
                        <div class="aspect-square bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center border border-slate-200">
                            <img id="originalPreview" class="max-w-full max-h-full object-contain" src="" alt="">
                        </div>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-blue-500 mb-2 text-center">圧縮後</p>
                        <div class="aspect-square bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center border border-blue-200 relative">
                            <img id="compressedPreview" class="max-w-full max-h-full object-contain" src="" alt="">
                            <div id="loadingOverlay" class="absolute inset-0 bg-white/50 flex items-center justify-center hidden">
                                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 初期メッセージ -->
            <div id="emptyState" class="h-full flex items-center justify-center bg-white border border-dashed border-slate-200 rounded-2xl p-12 text-slate-400">
                <div class="text-center">
                    <p>画像をアップロードすると分析が開始されます</p>
                </div>
            </div>
        </div>
    </main>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const settingsPanel = document.getElementById('settingsPanel');
    const analysisReport = document.getElementById('analysisReport');
    const emptyState = document.getElementById('emptyState');
    
    const qualityRange = document.getElementById('qualityRange');
    const qualityValue = document.getElementById('qualityValue');
    const widthRange = document.getElementById('widthRange');
    const widthValue = document.getElementById('widthValue');
    const formatSelect = document.getElementById('formatSelect');
    
    const originalPreview = document.getElementById('originalPreview');
    const compressedPreview = document.getElementById('compressedPreview');
    const originalSizeEl = document.getElementById('originalSize');
    const compressedSizeEl = document.getElementById('compressedSize');
    const savedSizeEl = document.getElementById('savedSize');
    const reductionRateEl = document.getElementById('reductionRate');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const downloadBtn = document.getElementById('downloadBtn');
    
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let originalFile = null;
    let originalImage = null;
    let compressedBlob = null;

    // イベントリスナー: ファイル選択
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    // ドラッグ＆ドロップ
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    // ファイル処理
    async function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showToast('画像ファイルを選択してください');
            return;
        }

        originalFile = file;
        showUI(true);
        originalSizeEl.innerText = formatFileSize(file.size);
        
        const reader = new FileReader();
        reader.onload = (e) => {
            originalPreview.src = e.target.result;
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                widthRange.max = img.width * 1.5;
                widthRange.value = img.width;
                widthValue.innerText = `${img.width}px (等倍)`;
                processImage();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // 圧縮・リサイズ処理
    async function processImage() {
        if (!originalImage) return;
        loadingOverlay.classList.remove('hidden');
        
        const quality = parseInt(qualityRange.value) / 100;
        const targetWidth = parseInt(widthRange.value);
        const targetHeight = (originalImage.height / originalImage.width) * targetWidth;
        const format = formatSelect.value;

        canvas.width = targetWidth;
        canvas.height = targetHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0, targetWidth, targetHeight);
        
        canvas.toBlob((blob) => {
            compressedBlob = blob;
            compressedPreview.src = URL.createObjectURL(blob);
            
            // レポート表示の更新
            const originalBytes = originalFile.size;
            const compressedBytes = blob.size;
            const savedBytes = Math.max(0, originalBytes - compressedBytes);
            
            compressedSizeEl.innerText = formatFileSize(compressedBytes);
            savedSizeEl.innerText = formatFileSize(savedBytes);
            
            const reduction = ((savedBytes / originalBytes) * 100).toFixed(1);
            reductionRateEl.innerText = `${reduction}%`;
            
            loadingOverlay.classList.add('hidden');
        }, format, quality);
    }

    // イベント設定
    qualityRange.addEventListener('input', () => {
        qualityValue.innerText = `${qualityRange.value}%`;
        debounceProcess();
    });

    widthRange.addEventListener('input', () => {
        const isOriginal = parseInt(widthRange.value) === originalImage.width;
        widthValue.innerText = isOriginal ? `${widthRange.value}px (等倍)` : `${widthRange.value}px`;
        debounceProcess();
    });

    formatSelect.addEventListener('change', processImage);

    let debounceTimer;
    function debounceProcess() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(processImage, 200);
    }

    downloadBtn.addEventListener('click', () => {
        if (!compressedBlob) return;
        const ext = formatSelect.value.split('/')[1];
        const fileName = `optimized_${originalFile.name.split('.')[0]}.${ext}`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(compressedBlob);
        a.download = fileName;
        a.click();
    });

    // サイズフォーマット（MB / KB / Bytes）
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        if (bytes < 1024) return bytes + ' B';
        
        const k = 1024;
        const m = k * 1024;
        
        if (bytes >= m) {
            return (bytes / m).toFixed(2) + ' MB';
        } else {
            return (bytes / k).toFixed(1) + ' KB';
        }
    }

    function showUI(hasFile) {
        settingsPanel.classList.toggle('hidden', !hasFile);
        analysisReport.classList.toggle('hidden', !hasFile);
        emptyState.classList.toggle('hidden', hasFile);
    }

    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 text-sm';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
</script>

</body>
</html>
