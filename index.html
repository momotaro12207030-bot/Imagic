<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eternal Atlas RPG</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.9);
      --line: rgba(148, 163, 184, 0.35);
      --accent: #22d3ee;
      --hp: #22c55e;
      --mp: #3b82f6;
      --xp: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg) 55%);
    }
    #app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr minmax(260px, 330px);
      gap: 12px;
      padding: 12px;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(3px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel h2 {
      margin: 0;
      padding: 10px 12px;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--line);
      color: #bae6fd;
    }
    #viewWrap {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      min-height: 0;
    }
    #world {
      width: 100%;
      height: 100%;
      display: block;
      background: #020617;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12px;
      color: #e0f2fe;
      font-weight: 700;
      text-shadow: 0 3px 10px rgba(0,0,0,0.9);
    }
    .content {
      padding: 10px 12px;
      overflow: auto;
      line-height: 1.45;
      font-size: 0.9rem;
    }
    .statLine { margin-bottom: 7px; }
    .bar {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(30,41,59,0.9);
      border: 1px solid rgba(148,163,184,0.3);
      margin-top: 4px;
    }
    .bar > div { height: 100%; }
    .hp { background: linear-gradient(90deg, #16a34a, #86efac); }
    .mp { background: linear-gradient(90deg, #2563eb, #7dd3fc); }
    .xp { background: linear-gradient(90deg, #f59e0b, #fde68a); }
    #battleCommands {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    button {
      border: 1px solid var(--line);
      background: rgba(15,23,42,0.9);
      color: #e2e8f0;
      border-radius: 10px;
      padding: 9px;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { border-color: var(--accent); color: #67e8f9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log {
      white-space: pre-wrap;
      font-size: 0.86rem;
      min-height: 120px;
      max-height: 250px;
      overflow: auto;
      background: rgba(2,6,23,0.65);
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 8px;
    }
    .grid {
      display: grid;
      gap: 8px;
    }
    .entry {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px;
      background: rgba(2, 6, 23, 0.5);
    }
    .legend {
      font-size: 0.82rem;
      opacity: 0.9;
      margin-top: 6px;
    }
    @media (max-width: 1100px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(320px, 45vh) auto;
      }
      .panel { max-height: 32vh; }
    }
  </style>
</head>
<body>
  <div id="app">
    <section class="panel">
      <h2>HERO STATUS</h2>
      <div class="content" id="heroPanel"></div>
      <h2>QUEST LOG</h2>
      <div class="content" id="questPanel"></div>
    </section>

    <section id="viewWrap">
      <canvas id="world"></canvas>
      <div id="overlay"></div>
    </section>

    <section class="panel">
      <h2>BATTLE / COMMAND</h2>
      <div class="content">
        <div id="battleState">探索中: WASD / 矢印キーで移動、Eで調査</div>
        <div id="battleCommands">
          <button id="attackBtn">攻撃</button>
          <button id="magicBtn">魔法</button>
          <button id="guardBtn">防御</button>
          <button id="itemBtn">回復薬</button>
        </div>
        <div class="legend">敵と接触するとコマンドバトル。ラスボス撃破が表クリア、深淵の竜撃破が裏クリア。</div>
        <h2 style="margin-top: 12px;">EVENT LOG</h2>
        <div id="log" class="log"></div>
        <h2 style="margin-top: 12px;">MONSTER BOOK</h2>
        <div id="book" class="grid"></div>
      </div>
    </section>
  </div>

  <script>
    const TILE = 32;
    const mapRows = [
      "########################################",
      "#..v....f...f....M.....f....v.........C#",
      "#..####..#######.....######..#####..####",
      "#..f....B....f.....f.......f....#......#",
      "#..####..###########..#####..#..#.###..#",
      "#..#..f....K....f....#...#..#..#...#..##",
      "#..#..###########..###...#..#..###.#...#",
      "#..#......f....#....f....#..#....#.#.v.#",
      "#..######..##..#.#########..####.#.###.#",
      "#..f....#..##..#.....f.........#.#...#.#",
      "#..####.#..##..###########..##.#.###.#.#",
      "#......f#..#....f.....f..#..##.#.....#.#",
      "#.#####.#..#.##########..#..##.#######.#",
      "#...f...#..#......f.....#..##...f.....##",
      "#..###..#..###########..#..#####..###..#",
      "#..#....#....f...f....E.#......#...#..##",
      "#..#.######.###########.######.###.#...#",
      "#..#......#.....f....#......#.....#..D.#",
      "#..####.#.##########.#.####.##########.#",
      "#..f....#......f.....#....#......f.....#",
      "########################################"
    ];

    const world = {
      width: mapRows[0].length,
      height: mapRows.length,
      tiles: mapRows.map(r => r.split("")),
      events: {
        C: { name: "王都シルフィア", text: "王都に到達。王からラスボス討伐命令を受諾。" },
        K: { name: "古城の鍵", text: "古城の鍵を発見。封印城に入れるようになった。", grant: "castleKey" },
        B: { name: "橋の建設", text: "職人の依頼を受け、橋を建設。深淵エリアへ行けるようになった。", grant: "bridge" },
        M: { name: "魔導塔", text: "魔導塔で奥義を獲得。魔法威力が上昇。", grant: "tower" },
        E: { name: "ラスボスの封印城", text: "封印城に突入。" },
        D: { name: "深淵の祭壇", text: "裏ボスの気配が漂う祭壇。" }
      }
    };

    const hero = {
      x: 2,
      y: 2,
      maxHp: 220,
      hp: 220,
      maxMp: 70,
      mp: 70,
      atk: 24,
      def: 12,
      lvl: 1,
      xp: 0,
      nextXp: 60,
      potions: 5,
      weaponTier: 1,
      flags: { castleKey: false, bridge: false, tower: false, clearFront: false, clearTrue: false }
    };

    const encounterTable = [
      { id: "slime", name: "蒼スライム", hp: 48, atk: 10, def: 4, xp: 18, biome: [".", "v"] },
      { id: "wolf", name: "影狼", hp: 72, atk: 15, def: 6, xp: 27, biome: ["f", "."] },
      { id: "golem", name: "遺跡ゴーレム", hp: 128, atk: 20, def: 12, xp: 44, biome: ["M", "#"] },
      { id: "wyvern", name: "黄昏ワイバーン", hp: 176, atk: 26, def: 14, xp: 72, biome: ["B", "E"] }
    ];

    const bosses = {
      final: { id: "demonlord", name: "冥王アバドン", hp: 480, atk: 36, def: 20, xp: 180 },
      true: { id: "abyssdragon", name: "深淵竜ネブラ", hp: 700, atk: 44, def: 24, xp: 300 }
    };

    const bestiary = new Map();
    const logEl = document.getElementById("log");
    const heroPanel = document.getElementById("heroPanel");
    const questPanel = document.getElementById("questPanel");
    const battleState = document.getElementById("battleState");
    const overlay = document.getElementById("overlay");
    const bookEl = document.getElementById("book");
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");

    const input = Object.create(null);
    let battle = null;
    let lastTick = performance.now();
    let anim = 0;

    function log(msg) {
      logEl.textContent = `${msg}\n${logEl.textContent}`.slice(0, 3500);
    }

    function wrapBar(value, max, cls) {
      const per = Math.max(0, Math.min(100, value / max * 100));
      return `<div class="bar"><div class="${cls}" style="width:${per}%"></div></div>`;
    }

    function refreshUI() {
      heroPanel.innerHTML = `
        <div class="statLine"><b>Lv.${hero.lvl} 探索者アルト</b></div>
        <div class="statLine">HP ${Math.ceil(hero.hp)} / ${hero.maxHp}${wrapBar(hero.hp, hero.maxHp, "hp")}</div>
        <div class="statLine">MP ${Math.ceil(hero.mp)} / ${hero.maxMp}${wrapBar(hero.mp, hero.maxMp, "mp")}</div>
        <div class="statLine">XP ${hero.xp} / ${hero.nextXp}${wrapBar(hero.xp, hero.nextXp, "xp")}</div>
        <div class="statLine">攻撃 ${hero.atk} / 防御 ${hero.def} / 回復薬 ${hero.potions}</div>
      `;

      questPanel.innerHTML = `
        <div class="entry">表クリア条件: 冥王アバドンを倒す ${hero.flags.clearFront ? "✅" : "⬜"}</div>
        <div class="entry">裏クリア条件: 深淵竜ネブラを倒す ${hero.flags.clearTrue ? "✅" : "⬜"}</div>
        <div class="entry">古城の鍵を入手 ${hero.flags.castleKey ? "✅" : "⬜"}</div>
        <div class="entry">橋を建設 ${hero.flags.bridge ? "✅" : "⬜"}</div>
        <div class="entry">魔導塔の奥義を習得 ${hero.flags.tower ? "✅" : "⬜"}</div>
        <div class="entry">図鑑登録数 ${bestiary.size} / 6</div>
        <div class="legend">目安プレイボリューム: 探索と育成を含め約3時間想定。</div>
      `;

      bookEl.innerHTML = ["slime", "wolf", "golem", "wyvern", "demonlord", "abyssdragon"].map(id => {
        if (!bestiary.has(id)) return `<div class="entry">${id} : ???</div>`;
        const e = bestiary.get(id);
        return `<div class="entry"><b>${e.name}</b><br>HP:${e.hp} ATK:${e.atk} DEF:${e.def}<br>${e.note}</div>`;
      }).join("");

      if (!battle) {
        battleState.textContent = `探索中: WASD / 矢印移動・E調査 | 地点(${hero.x},${hero.y})`;
      }
    }

    function levelCheck() {
      while (hero.xp >= hero.nextXp) {
        hero.xp -= hero.nextXp;
        hero.lvl++;
        hero.nextXp = Math.floor(hero.nextXp * 1.35);
        hero.maxHp += 38;
        hero.maxMp += 11;
        hero.atk += 6;
        hero.def += 4;
        hero.hp = hero.maxHp;
        hero.mp = hero.maxMp;
        hero.potions++;
        log(`レベルアップ！ Lv${hero.lvl} になった。能力上昇＆全快。`);
      }
    }

    function tileAt(x, y) {
      if (x < 0 || y < 0 || x >= world.width || y >= world.height) return "#";
      return world.tiles[y][x];
    }

    function passable(tile) {
      if (tile === "#") return false;
      if (tile === "E" && !hero.flags.castleKey) return false;
      if (tile === "D" && !hero.flags.bridge) return false;
      return true;
    }

    function discoverEnemy(enemy, note="遭遇") {
      if (!bestiary.has(enemy.id)) {
        bestiary.set(enemy.id, { ...enemy, note });
        log(`図鑑登録: ${enemy.name}`);
      }
    }

    function startBattle(enemyData) {
      battle = {
        enemy: JSON.parse(JSON.stringify(enemyData)),
        turn: 1,
        guarding: false
      };
      discoverEnemy(enemyData, "撃破して情報解析済み");
      battleState.textContent = `${battle.enemy.name} が出現！ コマンドを選択`;
      overlay.textContent = `⚔ BATTLE: ${battle.enemy.name}`;
      log(`${battle.enemy.name} が立ちはだかる！`);
    }

    function enemyTurn() {
      if (!battle) return;
      let dmg = Math.max(1, battle.enemy.atk - hero.def + Math.floor(Math.random() * 10) - 4);
      if (battle.guarding) dmg = Math.floor(dmg * 0.45);
      hero.hp -= dmg;
      log(`${battle.enemy.name}の攻撃 ${dmg} ダメージ`);
      battle.guarding = false;
      if (hero.hp <= 0) {
        hero.hp = 1;
        hero.x = 2;
        hero.y = 2;
        battle = null;
        overlay.textContent = "";
        log("力尽きた…拠点に戻された。HP1で再開。回復して再挑戦しよう。");
      }
    }

    function endBattle(victory) {
      if (!battle) return;
      if (victory) {
        hero.xp += battle.enemy.xp;
        log(`${battle.enemy.name}を撃破！ XP +${battle.enemy.xp}`);
        if (battle.enemy.id === "demonlord") {
          hero.flags.clearFront = true;
          log("表クリア達成！ だが深淵には更なる脅威が眠る。");
        }
        if (battle.enemy.id === "abyssdragon") {
          hero.flags.clearTrue = true;
          log("裏クリア達成！ 真の平和が訪れた。図鑑完成を目指そう。");
        }
        levelCheck();
      }
      battle = null;
      overlay.textContent = "";
      refreshUI();
    }

    function playerCommand(type) {
      if (!battle) return;
      const e = battle.enemy;
      if (type === "attack") {
        const dmg = Math.max(1, hero.atk + hero.weaponTier * 3 - e.def + Math.floor(Math.random() * 12));
        e.hp -= dmg;
        log(`攻撃！ ${e.name}に ${dmg} ダメージ`);
      } else if (type === "magic") {
        const cost = 12;
        if (hero.mp < cost) {
          log("MPが足りない！");
          return;
        }
        hero.mp -= cost;
        const boost = hero.flags.tower ? 1.8 : 1.3;
        const dmg = Math.floor((hero.atk * boost) + (hero.lvl * 2) + Math.random() * 18);
        e.hp -= dmg;
        log(`魔法《スターブレイク》! ${dmg} ダメージ`);
      } else if (type === "guard") {
        battle.guarding = true;
        log("防御体勢を取った。次の被ダメージを軽減。");
      } else if (type === "item") {
        if (hero.potions <= 0) {
          log("回復薬がない！");
          return;
        }
        hero.potions--;
        const heal = Math.min(hero.maxHp - hero.hp, 85);
        hero.hp += heal;
        log(`回復薬でHPを ${heal} 回復`);
      }

      if (e.hp <= 0) {
        endBattle(true);
        return;
      }

      enemyTurn();
      refreshUI();
      if (battle) {
        battleState.textContent = `${e.name} HP ${Math.max(0, Math.ceil(e.hp))} | あなたの行動`;
      }
    }

    function checkEvent(tile) {
      if (!world.events[tile]) return;
      const ev = world.events[tile];
      log(`[イベント] ${ev.name}: ${ev.text}`);
      if (ev.grant && !hero.flags[ev.grant]) {
        hero.flags[ev.grant] = true;
        if (ev.grant === "tower") hero.weaponTier = 2;
      }
      if (tile === "E") {
        startBattle(bosses.final);
      }
      if (tile === "D" && hero.flags.clearFront) {
        startBattle(bosses.true);
      } else if (tile === "D" && !hero.flags.clearFront) {
        log("深淵の祭壇は沈黙している。まずは冥王を倒す必要がある。");
      }
    }

    function randomEncounter(tile) {
      if (battle || "#EKCD".includes(tile)) return;
      const rate = tile === "f" ? 0.18 : tile === "v" ? 0.15 : 0.1;
      if (Math.random() > rate) return;
      const pool = encounterTable.filter(e => e.biome.includes(tile) || e.biome.includes("."));
      const enemy = pool[Math.floor(Math.random() * pool.length)];
      startBattle(enemy);
    }

    function moveHero(dx, dy) {
      if (battle) return;
      const nx = hero.x + dx;
      const ny = hero.y + dy;
      const tile = tileAt(nx, ny);
      if (!passable(tile)) {
        log(tile === "E" ? "封印城には鍵が必要だ。" : tile === "D" ? "深淵へ渡る橋がまだない。" : "進めない。");
        return;
      }
      hero.x = nx;
      hero.y = ny;
      if (world.events[tile] && ["K", "B", "M"].includes(tile)) checkEvent(tile);
      randomEncounter(tile);
      refreshUI();
    }

    function drawTile(x, y, ch) {
      const px = x * TILE;
      const py = y * TILE;
      const pulse = 0.5 + Math.sin(anim / 400) * 0.18;

      const palette = {
        "#": "#334155",
        ".": "#14532d",
        "f": "#166534",
        "v": "#0f766e",
        "K": "#facc15",
        "B": "#fb7185",
        "M": "#a78bfa",
        "C": "#38bdf8",
        "E": "#ef4444",
        "D": "#f97316"
      };

      ctx.fillStyle = palette[ch] || "#1e293b";
      ctx.fillRect(px, py, TILE, TILE);
      ctx.strokeStyle = "rgba(15,23,42,0.35)";
      ctx.strokeRect(px, py, TILE, TILE);

      if ("KBMEC D".replace(/\s/g,"").includes(ch)) {
        ctx.fillStyle = `rgba(255,255,255,${pulse})`;
        ctx.beginPath();
        ctx.arc(px + TILE / 2, py + TILE / 2, 5 + pulse * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw() {
      const w = world.width * TILE;
      const h = world.height * TILE;
      canvas.width = w;
      canvas.height = h;
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      ctx.setTransform(1,0,0,1,0,0);

      for (let y = 0; y < world.height; y++) {
        for (let x = 0; x < world.width; x++) drawTile(x, y, world.tiles[y][x]);
      }

      // enemy markers
      for (let i = 0; i < 24; i++) {
        const ex = (i * 7 + 3) % world.width;
        const ey = (i * 11 + 4) % world.height;
        const t = tileAt(ex, ey);
        if (t === "#") continue;
        ctx.fillStyle = `rgba(248,113,113,${0.28 + (Math.sin((anim + i * 60) / 260) + 1) * 0.2})`;
        ctx.beginPath();
        ctx.arc(ex * TILE + TILE / 2, ey * TILE + TILE / 2, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // hero sprite
      const hx = hero.x * TILE + TILE / 2;
      const hy = hero.y * TILE + TILE / 2;
      ctx.save();
      ctx.translate(hx, hy);
      ctx.fillStyle = "#e2e8f0";
      ctx.beginPath();
      ctx.arc(0, -6, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(-7, 1, 14, 15);
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(8, 2, 4, 12);
      ctx.restore();
    }

    function loop(ts) {
      const dt = ts - lastTick;
      lastTick = ts;
      anim += dt;

      if (!battle) {
        const speed = 120;
        if (input.ArrowUp || input.w) moveHero(0, -1);
        else if (input.ArrowDown || input.s) moveHero(0, 1);
        else if (input.ArrowLeft || input.a) moveHero(-1, 0);
        else if (input.ArrowRight || input.d) moveHero(1, 0);
        if (input.e) {
          checkEvent(tileAt(hero.x, hero.y));
          input.e = false;
        }
      }

      if (hero.flags.clearFront && hero.flags.clearTrue && bestiary.size === 6) {
        overlay.textContent = "★ 図鑑完成 + 真エンド達成 ★";
      }

      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById("attackBtn").onclick = () => playerCommand("attack");
    document.getElementById("magicBtn").onclick = () => playerCommand("magic");
    document.getElementById("guardBtn").onclick = () => playerCommand("guard");
    document.getElementById("itemBtn").onclick = () => playerCommand("item");

    window.addEventListener("keydown", e => {
      input[e.key] = true;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
    });
    window.addEventListener("keyup", e => { input[e.key] = false; });

    log("Eternal Atlas RPG 起動。王都を目指し、鍵・橋・奥義を集めて世界を救え。");
    refreshUI();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
