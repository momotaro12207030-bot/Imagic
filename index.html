<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Pod</title>
  <style>
    :root {
      --bg-1: #020a1a;
      --bg-2: #041634;
      --rim: rgba(138, 188, 255, 0.25);
      --water: rgba(122, 187, 255, 0.58);
      --water-deep: rgba(77, 151, 238, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg-1);
      font-family: "Segoe UI", sans-serif;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 50% 45%, rgba(51, 121, 206, 0.2) 0%, rgba(7, 24, 52, 0.1) 26%, transparent 52%),
        radial-gradient(circle at 18% 20%, rgba(70, 125, 210, 0.13) 0%, transparent 38%),
        radial-gradient(circle at 83% 28%, rgba(77, 149, 255, 0.12) 0%, transparent 33%),
        radial-gradient(circle at 50% 100%, rgba(43, 86, 152, 0.25) 0%, transparent 40%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }

    .mist,
    .mist::before,
    .mist::after {
      position: absolute;
      content: "";
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      background: radial-gradient(circle, rgba(103, 173, 255, 0.14), rgba(103, 173, 255, 0));
    }

    .mist {
      width: 52vmin;
      height: 52vmin;
      left: 50%;
      top: 41%;
      transform: translate(-50%, -50%);
      animation: breathe 7s ease-in-out infinite;
    }

    .mist::before {
      width: 20vmin;
      height: 20vmin;
      left: -30vmin;
      top: -16vmin;
      animation: drift 10s ease-in-out infinite;
    }

    .mist::after {
      width: 15vmin;
      height: 15vmin;
      right: -27vmin;
      top: -8vmin;
      animation: drift 12s ease-in-out infinite reverse;
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 23% 28%, rgba(165, 216, 255, 0.32) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 35%, rgba(165, 216, 255, 0.28) 0 2px, transparent 3px),
        radial-gradient(circle at 41% 62%, rgba(165, 216, 255, 0.26) 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 60% 19%, rgba(165, 216, 255, 0.22) 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 30% 74%, rgba(165, 216, 255, 0.2) 0 1.5px, transparent 2.5px);
      opacity: 0.75;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .pod {
      position: relative;
      width: min(43vmin, 420px);
      aspect-ratio: 1;
      border-radius: 46% 54% 49% 51% / 48% 50% 50% 52%;
      border: 1px solid var(--rim);
      box-shadow:
        inset 0 0 90px rgba(132, 190, 255, 0.18),
        inset 0 -55px 100px rgba(14, 46, 90, 0.45),
        0 0 70px rgba(81, 158, 255, 0.15);
      background: radial-gradient(circle at 46% 34%, rgba(176, 223, 255, 0.36), rgba(83, 151, 236, 0.08) 46%, rgba(10, 32, 68, 0.32) 100%);
      animation: wobble 8s ease-in-out infinite;
      overflow: hidden;
      transform: scale(var(--pod-scale, 1));
      transition: transform 0.8s ease;
    }

    .core {
      position: absolute;
      left: 50%;
      top: 47%;
      width: 20%;
      aspect-ratio: 1;
      border-radius: 44% 56% 51% 49% / 52% 44% 56% 48%;
      transform: translate(-50%, -50%) scale(var(--core-scale, 0.7));
      background: radial-gradient(circle at 45% 35%, rgba(221, 244, 255, 0.7) 0%, rgba(125, 188, 255, 0.2) 58%, rgba(80, 142, 222, 0.05) 100%);
      box-shadow: 0 0 34px rgba(138, 201, 255, 0.5);
      transition: transform 0.8s ease, opacity 0.8s ease;
      opacity: var(--core-opacity, 0.75);
      filter: blur(0.3px);
      animation: pulse 3.2s ease-in-out infinite;
    }

    .water {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 8%;
      height: 30%;
      border-radius: 50% 50% 42% 43% / 65% 65% 35% 35%;
      background:
        radial-gradient(circle at 50% 30%, rgba(201, 231, 255, 0.54), transparent 42%),
        linear-gradient(180deg, var(--water), var(--water-deep));
      box-shadow: inset 0 14px 24px rgba(214, 236, 255, 0.24);
      transition: height 0.6s ease;
    }

    .water::before,
    .water::after {
      content: "";
      position: absolute;
      background: rgba(197, 230, 255, 0.24);
      border-radius: 50%;
      filter: blur(1px);
    }

    .water::before { width: 54px; height: 54px; left: 20%; top: 18%; }
    .water::after { width: 32px; height: 32px; right: 22%; top: 42%; }

    .can {
      position: fixed;
      top: 26px;
      right: 30px;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      border: 1px solid rgba(162, 211, 255, 0.45);
      background: rgba(120, 176, 255, 0.14);
      color: #bde0ff;
      font-size: 2rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(5, 26, 56, 0.46);
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .can:hover { transform: translateY(-3px); background: rgba(132, 190, 255, 0.22); }
    .can:active { transform: translateY(0); }
    .can.locked {
      opacity: 0.55;
      cursor: default;
      filter: saturate(0.6);
    }

    .drops {
      position: fixed;
      top: 98px;
      right: 60px;
      width: 2px;
      height: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .drops.active { opacity: 1; }

    .drop {
      position: absolute;
      width: 5px;
      height: 15px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(208, 236, 255, 0.95), rgba(116, 179, 255, 0.78));
      animation: fall 0.9s linear forwards;
    }

    .hint {
      position: fixed;
      left: 24px;
      bottom: 20px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(180, 220, 255, 0.55);
      box-shadow: 0 0 16px rgba(135, 196, 255, 0.8);
      opacity: 0.7;
    }

    @keyframes fall {
      from { transform: translate(0, 0); opacity: 1; }
      to { transform: translate(calc(-140px + var(--x)), 330px); opacity: 0; }
    }

    @keyframes wobble {
      0%, 100% { border-radius: 46% 54% 49% 51% / 48% 50% 50% 52%; }
      50% { border-radius: 51% 49% 53% 47% / 50% 47% 53% 50%; }
    }

    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.06); }
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(14px); }
    }

    @keyframes pulse {
      0%, 100% { filter: blur(0.3px) brightness(1); }
      50% { filter: blur(0.8px) brightness(1.15); }
    }
  </style>
</head>
<body>
  <div class="mist"></div>
  <div class="stars"></div>

  <main class="scene">
    <section id="pod" class="pod" aria-label="pod">
      <div id="core" class="core"></div>
      <div id="water" class="water"></div>
    </section>
  </main>

  <button id="waterBtn" class="can" aria-label="water">💧</button>
  <div id="drops" class="drops" aria-hidden="true"></div>
  <div class="hint" aria-hidden="true"></div>

  <script>
    const STORAGE_KEY = "water-pod-wallpaper-v2";

    const state = {
      water: 28,
      growth: 4,
      lastWaterDay: null,
      lastTickAt: Date.now()
    };

    const podEl = document.getElementById("pod");
    const coreEl = document.getElementById("core");
    const waterEl = document.getElementById("water");
    const waterBtn = document.getElementById("waterBtn");
    const drops = document.getElementById("drops");

    function dayKey(timestamp = Date.now()) {
      const d = new Date(timestamp);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function canWaterToday() {
      return state.lastWaterDay !== dayKey();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        Object.assign(state, parsed);
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function applyOfflineProgress() {
      const now = Date.now();
      const elapsedMs = Math.max(0, now - state.lastTickAt);
      const hours = elapsedMs / (1000 * 60 * 60);

      if (hours > 0) {
        const hydrationFactor = Math.max(0.45, state.water / 60);
        state.growth = Math.min(100, state.growth + hours * 0.45 * hydrationFactor);
        state.water = Math.max(14, state.water - hours * 0.55);
      }

      state.lastTickAt = now;
    }

    function render() {
      const water = Math.min(82, Math.max(14, state.water));
      const growth = Math.min(100, Math.max(0, state.growth));

      waterEl.style.height = `${water}%`;

      const podScale = 0.92 + growth * 0.0015;
      const coreScale = 0.58 + growth * 0.011;
      const coreOpacity = 0.48 + growth * 0.0045;

      podEl.style.setProperty("--pod-scale", String(podScale));
      coreEl.style.setProperty("--core-scale", String(coreScale));
      coreEl.style.setProperty("--core-opacity", String(Math.min(1, coreOpacity)));

      if (canWaterToday()) {
        waterBtn.classList.remove("locked");
        waterBtn.textContent = "💧";
      } else {
        waterBtn.classList.add("locked");
        waterBtn.textContent = "✓";
      }
    }

    function spawnDrops() {
      drops.classList.add("active");
      drops.innerHTML = "";

      for (let i = 0; i < 18; i++) {
        const d = document.createElement("span");
        d.className = "drop";
        d.style.left = `${Math.random() * 22 - 10}px`;
        d.style.animationDelay = `${Math.random() * 0.15}s`;
        d.style.setProperty("--x", `${Math.random() * 120}px`);
        drops.appendChild(d);
      }

      setTimeout(() => {
        drops.classList.remove("active");
        drops.innerHTML = "";
      }, 980);
    }

    function pour() {
      if (!canWaterToday()) return;

      state.lastWaterDay = dayKey();
      state.water = Math.min(82, state.water + 14);
      state.growth = Math.min(100, state.growth + 2.6);
      state.lastTickAt = Date.now();

      spawnDrops();
      render();
      saveState();
    }

    function passiveStep() {
      const now = Date.now();
      const elapsedHours = (now - state.lastTickAt) / (1000 * 60 * 60);
      const safeElapsed = Math.max(0, Math.min(1.2, elapsedHours));
      const hydrationFactor = Math.max(0.35, state.water / 65);

      state.growth = Math.min(100, state.growth + safeElapsed * 0.3 * hydrationFactor);
      state.water = Math.max(14, state.water - safeElapsed * 0.7);
      state.lastTickAt = now;

      render();
      saveState();
    }

    waterBtn.addEventListener("click", pour);
    window.addEventListener("beforeunload", saveState);

    loadState();
    applyOfflineProgress();
    render();
    saveState();

    setInterval(passiveStep, 60000);
    setInterval(saveState, 12000);
  </script>
</body>
</html>
