<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YABAME - 3D Racing</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #020617;
    }
    #game { width: 100%; height: 100%; display: block; }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      padding: 12px;
      color: #e2e8f0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .center {
      text-align: center;
      font-weight: 900;
      font-size: clamp(28px, 4.5vw, 62px);
      letter-spacing: 0.14em;
      color: #7dd3fc;
      margin-top: 3vh;
    }
    .msg {
      text-align: center;
      margin-bottom: 2vh;
      font-size: clamp(12px, 1.8vw, 18px);
      opacity: 0.95;
    }
    .bar {
      width: min(380px, 75vw);
      height: 14px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(148,163,184,0.5);
      background: rgba(15,23,42,0.75);
    }
    .bar > div { height: 100%; transform-origin: left center; background: linear-gradient(90deg,#38bdf8,#22d3ee,#34d399); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="row">
      <div class="pill" id="speed">SPEED 0 km/h</div>
      <div class="pill" id="lap">LAP 1/3</div>
      <div class="pill" id="time">TIME 0.0s</div>
      <div class="pill" id="best">BEST --</div>
    </div>

    <div class="center">YABAME</div>

    <div class="row" style="align-items:flex-end;">
      <div>
        <div class="pill" style="margin-bottom:8px;">BOOST</div>
        <div class="bar"><div id="boost"></div></div>
      </div>
      <div class="msg" id="msg">↑/W 加速 ↓/S ブレーキ ←→/A,D ハンドル Shift ブースト</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const ui = {
      speed: document.getElementById('speed'),
      lap: document.getElementById('lap'),
      time: document.getElementById('time'),
      best: document.getElementById('best'),
      boost: document.getElementById('boost'),
      msg: document.getElementById('msg')
    };

    const key = Object.create(null);

    const roadWidth = 2000;
    const segmentLength = 180;
    const rumbleLength = 3;
    const drawDistance = 220;
    const lanes = 3;
    const cameraHeight = 900;
    const fov = 100;
    const cameraDepth = 1 / Math.tan((fov * Math.PI / 180) / 2);

    let width = 0;
    let height = 0;

    const state = {
      segments: [],
      cars: [],
      trackLength: 0,
      position: 0,
      speed: 0,
      playerX: 0,
      boost: 1,
      lap: 1,
      maxLap: 3,
      lapStartTime: performance.now(),
      raceStartTime: performance.now(),
      raceFinished: false,
      raceCountdown: 3,
      countdownDone: false,
      crashTimer: 0,
      bestTime: Number(localStorage.getItem('yabame-best-time') || 0)
    };

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function easeIn(a, b, p) { return a + (b - a) * p * p; }
    function easeOut(a, b, p) { return a + (b - a) * (1 - (1 - p) * (1 - p)); }
    function easeInOut(a, b, p) { return a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5); }

    function addSegment(curve, y) {
      const n = state.segments.length;
      state.segments.push({
        index: n,
        curve,
        p1: { world: { y: state.segments.length ? state.segments[state.segments.length - 1].p2.world.y : 0 }, camera: {}, screen: {} },
        p2: { world: { y }, camera: {}, screen: {} },
        color: Math.floor(n / rumbleLength) % 2 ?
          { road: '#111827', grass: '#14532d', rumble: '#e2e8f0', lane: '#f8fafc' } :
          { road: '#0f172a', grass: '#166534', rumble: '#dc2626', lane: '#cbd5e1' },
      });
    }

    function addRoad(enter, hold, leave, curve, hill) {
      const startY = state.segments.length ? state.segments[state.segments.length - 1].p2.world.y : 0;
      const endY = startY + hill * segmentLength;
      const total = enter + hold + leave;

      for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
      for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
      for (let n = 0; n < leave; n++) addSegment(easeOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
    }

    function buildTrack() {
      state.segments = [];
      addRoad(25, 40, 25, 0, 0);
      addRoad(30, 50, 30, 0.8, 25);
      addRoad(20, 40, 20, -1.1, -30);
      addRoad(30, 60, 30, 1.3, 15);
      addRoad(25, 45, 25, -0.9, 0);
      addRoad(18, 35, 18, 0, 40);
      addRoad(40, 80, 40, 0.6, -45);
      addRoad(20, 50, 20, -1.4, 22);
      addRoad(35, 70, 35, 0, 0);
      state.trackLength = state.segments.length * segmentLength;
    }

    function addCars(count = 26) {
      state.cars = [];
      for (let i = 0; i < count; i++) {
        state.cars.push({
          z: (i * state.trackLength / count) + Math.random() * 600,
          x: (Math.random() * 2 - 1) * 0.85,
          speed: 3200 + Math.random() * 2200,
          color: ['#f97316', '#22d3ee', '#34d399', '#a78bfa', '#f43f5e'][i % 5]
        });
      }
    }

    function findSegment(z) {
      return state.segments[Math.floor(z / segmentLength) % state.segments.length];
    }

    function project(p, cameraX, cameraY, cameraZ) {
      p.camera.x = p.world.x - cameraX;
      p.camera.y = p.world.y - cameraY;
      p.camera.z = p.world.z - cameraZ;
      p.screen.scale = cameraDepth / p.camera.z;
      p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
      p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
      p.screen.w = Math.round((p.screen.scale * roadWidth * width / 2));
    }

    function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.lineTo(x4, y4);
      ctx.closePath();
      ctx.fill();
    }

    function drawSpriteRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x - w / 2, y - h, w, h);
    }

    function updateCars(dt) {
      for (const car of state.cars) {
        car.z += car.speed * dt;
        while (car.z >= state.trackLength) car.z -= state.trackLength;
        car.x += Math.sin((car.z + car.speed) * 0.0002) * dt * 0.45;
        car.x = Math.max(-0.9, Math.min(0.9, car.x));
      }
    }

    function resetRace() {
      state.position = 0;
      state.speed = 0;
      state.playerX = 0;
      state.boost = 1;
      state.lap = 1;
      state.raceFinished = false;
      state.raceCountdown = 3;
      state.countdownDone = false;
      state.raceStartTime = performance.now();
      state.lapStartTime = performance.now();
      state.crashTimer = 0;
      ui.msg.textContent = '3...';
      addCars();
    }

    function update(dt, now) {
      if (!state.countdownDone) {
        state.raceCountdown -= dt;
        if (state.raceCountdown > 0) ui.msg.textContent = `${Math.ceil(state.raceCountdown)}...`;
        else {
          state.countdownDone = true;
          ui.msg.textContent = 'GO!';
          setTimeout(() => {
            if (!state.raceFinished) ui.msg.textContent = '↑/W 加速 ↓/S ブレーキ ←→/A,D ハンドル Shift ブースト';
          }, 700);
        }
        return;
      }

      if (state.raceFinished) {
        if (key.Enter || key[' ']) resetRace();
        return;
      }

      const accel = key.ArrowUp || key.w;
      const brake = key.ArrowDown || key.s;
      const left = key.ArrowLeft || key.a;
      const right = key.ArrowRight || key.d;
      const boostOn = (key.Shift || key.ShiftLeft || key.ShiftRight) && state.boost > 0.03 && state.speed > 4500;

      const maxSpeed = 9800;
      const accelRate = 6200;
      const brakeRate = 8600;
      const naturalDecel = 2600;

      if (accel) state.speed += accelRate * dt;
      else state.speed -= naturalDecel * dt;
      if (brake) state.speed -= brakeRate * dt;

      if (boostOn) {
        state.speed += 9800 * dt;
        state.boost = Math.max(0, state.boost - dt * 0.26);
      } else {
        state.boost = Math.min(1, state.boost + dt * 0.11);
      }

      const segment = findSegment(state.position + 500);
      state.speed = Math.max(0, Math.min(maxSpeed * 1.18, state.speed));

      const steer = 2.1 * (state.speed / maxSpeed);
      if (left) state.playerX -= steer * dt;
      if (right) state.playerX += steer * dt;
      state.playerX -= segment.curve * 0.42 * (state.speed / maxSpeed) * dt;

      if (Math.abs(state.playerX) > 1) state.speed -= 3800 * dt;
      state.playerX = Math.max(-1.25, Math.min(1.25, state.playerX));

      state.position += state.speed * dt;
      updateCars(dt);

      if (state.position >= state.trackLength) {
        state.position -= state.trackLength;
        state.lap += 1;
        if (state.lap > state.maxLap) {
          state.raceFinished = true;
          const total = (now - state.raceStartTime) / 1000;
          ui.msg.textContent = `FINISH ${total.toFixed(2)}s  Enter/Spaceで再スタート`;
          if (!state.bestTime || total < state.bestTime) {
            state.bestTime = total;
            localStorage.setItem('yabame-best-time', String(total));
          }
        } else {
          ui.msg.textContent = `LAP ${state.lap}/${state.maxLap}`;
          setTimeout(() => {
            if (!state.raceFinished) ui.msg.textContent = '↑/W 加速 ↓/S ブレーキ ←→/A,D ハンドル Shift ブースト';
          }, 800);
        }
      }

      if (state.crashTimer > 0) state.crashTimer -= dt;
      for (const car of state.cars) {
        let dz = car.z - state.position;
        if (dz < -state.trackLength / 2) dz += state.trackLength;
        if (dz > state.trackLength / 2) dz -= state.trackLength;
        if (dz > 0 && dz < 240) {
          if (Math.abs(state.playerX - car.x) < 0.18 && state.crashTimer <= 0) {
            state.speed *= 0.38;
            state.crashTimer = 0.7;
            ui.msg.textContent = '接触！ラインを整えろ！';
            setTimeout(() => {
              if (!state.raceFinished) ui.msg.textContent = '↑/W 加速 ↓/S ブレーキ ←→/A,D ハンドル Shift ブースト';
            }, 650);
          }
        }
      }
    }

    function render(now) {
      const base = findSegment(state.position);
      let maxY = height;
      let x = 0;
      let dx = -(base.curve * (state.position % segmentLength) / segmentLength);

      const sky = ctx.createLinearGradient(0, 0, 0, height * 0.55);
      sky.addColorStop(0, '#1d4ed8');
      sky.addColorStop(0.65, '#0f172a');
      sky.addColorStop(1, '#030712');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      for (let n = 0; n < drawDistance; n++) {
        const segment = state.segments[(base.index + n) % state.segments.length];
        segment.looped = segment.index < base.index;
        segment.fog = n / drawDistance;

        const p1 = segment.p1;
        const p2 = segment.p2;

        p1.world.x = x;
        p1.world.y = segment.p1.world.y;
        p1.world.z = segment.index * segmentLength - (segment.looped ? state.trackLength : 0);

        p2.world.x = x + dx;
        p2.world.y = segment.p2.world.y;
        p2.world.z = (segment.index + 1) * segmentLength - (segment.looped ? state.trackLength : 0);

        project(p1, state.playerX * roadWidth, cameraHeight, state.position - (segment.looped ? state.trackLength : 0));
        project(p2, state.playerX * roadWidth, cameraHeight, state.position - (segment.looped ? state.trackLength : 0));

        x += dx;
        dx += segment.curve;

        if (p1.camera.z <= cameraDepth || p2.screen.y >= p1.screen.y || p2.screen.y >= maxY) continue;

        drawPolygon(0, p2.screen.y, width, p2.screen.y, width, maxY, 0, maxY, segment.color.grass);
        drawPolygon(p1.screen.x - p1.screen.w * 1.08, p1.screen.y, p1.screen.x + p1.screen.w * 1.08, p1.screen.y, p2.screen.x + p2.screen.w * 1.08, p2.screen.y, p2.screen.x - p2.screen.w * 1.08, p2.screen.y, segment.color.rumble);
        drawPolygon(p1.screen.x - p1.screen.w, p1.screen.y, p1.screen.x + p1.screen.w, p1.screen.y, p2.screen.x + p2.screen.w, p2.screen.y, p2.screen.x - p2.screen.w, p2.screen.y, segment.color.road);

        if (Math.floor(segment.index / rumbleLength) % 2 === 0) {
          drawPolygon(p1.screen.x - p1.screen.w * 0.02, p1.screen.y, p1.screen.x + p1.screen.w * 0.02, p1.screen.y, p2.screen.x + p2.screen.w * 0.02, p2.screen.y, p2.screen.x - p2.screen.w * 0.02, p2.screen.y, segment.color.lane);
        }

        maxY = p2.screen.y;
      }

      for (const car of state.cars) {
        let dz = car.z - state.position;
        if (dz < 0) dz += state.trackLength;
        if (dz <= 0 || dz > drawDistance * segmentLength) continue;
        const scale = cameraDepth / dz;
        const carX = (width / 2) + (scale * car.x * roadWidth * width / 2);
        const carY = (height / 2) - (scale * (findSegment(car.z).p2.world.y - cameraHeight) * height / 2);
        const w = Math.max(8, scale * 190 * width / 2);
        const h = Math.max(10, scale * 90 * width / 2);
        drawSpriteRect(carX, carY, w, h, car.color);
        drawSpriteRect(carX, carY - h * 0.08, w * 0.62, h * 0.32, '#1e293b');
      }

      const bounce = Math.sin(now * 0.02) * 2;
      const px = width * 0.5 + state.playerX * width * 0.24;
      const py = height * 0.87 + bounce;
      ctx.fillStyle = state.crashTimer > 0 ? '#ef4444' : '#38bdf8';
      ctx.fillRect(px - 38, py - 26, 76, 46);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(px - 24, py - 18, 48, 14);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(px - 38, py + 2, 76, 12);

      if (state.speed > 4500) {
        const flame = 10 + (state.speed / 9800) * 20;
        ctx.fillStyle = 'rgba(34,211,238,0.9)';
        ctx.beginPath();
        ctx.moveTo(px - 14, py + 21);
        ctx.lineTo(px, py + 21 + flame);
        ctx.lineTo(px + 14, py + 21);
        ctx.fill();
      }

      const raceTime = state.raceFinished ? state.bestTime : (now - state.raceStartTime) / 1000;
      ui.speed.textContent = `SPEED ${Math.floor((state.speed / 9800) * 360)} km/h`;
      ui.lap.textContent = `LAP ${Math.min(state.lap, state.maxLap)}/${state.maxLap}`;
      ui.time.textContent = `TIME ${raceTime.toFixed(1)}s`;
      ui.best.textContent = state.bestTime ? `BEST ${state.bestTime.toFixed(2)}s` : 'BEST --';
      ui.boost.style.transform = `scaleX(${state.boost})`;
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt, now);
      render(now);
      requestAnimationFrame(frame);
    }

    window.addEventListener('keydown', (e) => {
      key[e.key] = true;
      if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { key[e.key] = false; });
    window.addEventListener('resize', resize);

    resize();
    buildTrack();
    resetRace();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
