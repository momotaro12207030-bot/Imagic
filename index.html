<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新幹線をぴったり止めろ！</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: radial-gradient(circle at top, #0b1b49, #020617 65%);
      color: #e2e8f0;
      overflow: hidden;
    }
    .game {
      width: min(1000px, 95vw);
      border: 1px solid #334155;
      border-radius: 14px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .track {
      position: relative;
      height: 320px;
      background:
        linear-gradient(#38bdf8 0 35%, #93c5fd00 35%),
        linear-gradient(#334155 0 65%, #1e293b 65%);
    }
    .rail {
      position: absolute;
      left: 0;
      right: 0;
      top: 190px;
      height: 8px;
      background: #94a3b8;
      box-shadow: 0 24px 0 #94a3b8;
    }
    .platform {
      position: absolute;
      right: 80px;
      top: 155px;
      width: 90px;
      height: 86px;
      border: 3px solid #facc15;
      background: #fef08a22;
    }
    .platform::before {
      content: "停車位置";
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 14px;
      color: #fef08a;
      white-space: nowrap;
    }
    .train {
      position: absolute;
      left: 20px;
      top: 120px;
      width: 150px;
      height: 88px;
      border-radius: 12px;
      background: linear-gradient(180deg, #f8fafc, #cbd5e1);
      border: 2px solid #94a3b8;
    }
    .train::before {
      content: "";
      position: absolute;
      inset: 15px 20px auto;
      height: 16px;
      background: #0ea5e9;
      border-radius: 999px;
    }
    .train::after {
      content: "";
      position: absolute;
      right: -14px;
      top: 22px;
      width: 18px;
      height: 32px;
      background: #e2e8f0;
      border-radius: 0 10px 10px 0;
      border: 2px solid #94a3b8;
      border-left: none;
    }
    .hud {
      display: grid;
      gap: 10px;
      padding: 16px;
      background: #020617;
    }
    .row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .pill {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
    }
    .message { font-size: clamp(18px, 2.5vw, 28px); font-weight: 800; color: #7dd3fc; }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(90deg, #22d3ee, #38bdf8);
      color: #082f49;
    }
  </style>
</head>
<body>
  <main class="game">
    <section class="track" id="track">
      <div class="rail"></div>
      <div class="platform" id="target"></div>
      <div class="train" id="train"></div>
    </section>
    <section class="hud">
      <div class="row">
        <div class="pill" id="speed">速度: 0 km/h</div>
        <div class="pill" id="distance">残り: -- m</div>
        <div class="pill" id="score">誤差: -- cm</div>
      </div>
      <div class="row">
        <div class="message" id="message">スペースキーで発車、もう一度押してブレーキ！</div>
        <button id="retry">もう一回</button>
      </div>
    </section>
  </main>

  <script>
    const train = document.getElementById('train');
    const target = document.getElementById('target');
    const speedEl = document.getElementById('speed');
    const distanceEl = document.getElementById('distance');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');
    const retryBtn = document.getElementById('retry');

    const state = {
      running: false,
      ended: false,
      x: 20,
      v: 0,
      targetX: 0,
      braking: false
    };

    function reset() {
      const min = 560;
      const max = 820;
      state.running = false;
      state.ended = false;
      state.braking = false;
      state.x = 20;
      state.v = 0;
      state.targetX = Math.floor(Math.random() * (max - min + 1)) + min;
      target.style.right = `${1000 - state.targetX - 90}px`;
      updateHud();
      messageEl.textContent = 'スペースキーで発車、もう一度押してブレーキ！';
      scoreEl.textContent = '誤差: -- cm';
    }

    function updateHud() {
      const remainPx = state.targetX - (state.x + 150);
      const remainM = (remainPx * 0.45).toFixed(1);
      speedEl.textContent = `速度: ${Math.max(0, state.v * 7.8).toFixed(0)} km/h`;
      distanceEl.textContent = `残り: ${remainM} m`;
      train.style.left = `${state.x}px`;
    }

    function evaluate() {
      const stopPoint = state.x + 150;
      const targetCenter = state.targetX + 45;
      const diffPx = stopPoint - targetCenter;
      const diffCm = Math.abs(diffPx * 4.5);
      let rank = '🤡 くそげー職人';
      if (diffCm <= 10) rank = '🏆 神運転士';
      else if (diffCm <= 50) rank = '🥈 かなり上手い';
      else if (diffCm <= 120) rank = '🙂 まぁ普通';

      const direction = diffPx > 0 ? 'オーバーラン' : '手前停車';
      messageEl.textContent = `${rank}：${direction}`;
      scoreEl.textContent = `誤差: ${diffCm.toFixed(1)} cm`;
    }

    function gameLoop() {
      if (state.ended) return;
      if (state.running) {
        if (state.braking) {
          state.v -= 0.22;
          if (state.v <= 0) {
            state.v = 0;
            state.running = false;
            state.ended = true;
            evaluate();
          }
        } else {
          state.v = Math.min(26, state.v + 0.18);
        }

        state.x += state.v;

        if (state.x > 870) {
          state.ended = true;
          messageEl.textContent = '🚨 駅を通り過ぎた！';
          scoreEl.textContent = '誤差: 計測不能';
        }
        updateHud();
      }
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (event) => {
      if (event.code !== 'Space') return;
      event.preventDefault();

      if (state.ended) return;
      if (!state.running) {
        state.running = true;
        state.v = 3;
        messageEl.textContent = '加速中！狙ってスペースでブレーキ！';
      } else if (!state.braking) {
        state.braking = true;
        messageEl.textContent = '急ブレーキ中…祈れ！';
      }
    });

    retryBtn.addEventListener('click', reset);

    reset();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
