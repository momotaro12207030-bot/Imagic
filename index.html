<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morph Playground</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }

    body {
      background:
        radial-gradient(circle at 20% 15%, rgba(64, 126, 255, 0.18), transparent 42%),
        radial-gradient(circle at 78% 22%, rgba(35, 180, 255, 0.16), transparent 35%),
        radial-gradient(circle at 48% 90%, rgba(98, 0, 255, 0.2), transparent 48%),
        #020617;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: saturate(122%) contrast(108%);
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, transparent 48%, rgba(2, 6, 23, 0.52) 100%);
      mix-blend-mode: multiply;
    }

    .grain {
      position: fixed;
      inset: -100%;
      pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.07) 0.7px, transparent 0.8px);
      background-size: 3px 3px;
      opacity: 0.08;
      animation: grainShift 8s steps(6) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(3%, -2%); }
      50% { transform: translate(-2%, 2%); }
      75% { transform: translate(-3%, -1%); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="morphing-visual"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <script>
    const STORAGE_KEY = "morph-playground-v1";
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = 1;

    const palettes = [
      ["#67e8f9", "#60a5fa", "#a78bfa", "#f472b6"],
      ["#22d3ee", "#0ea5e9", "#6366f1", "#14b8a6"],
      ["#f59e0b", "#ef4444", "#fb7185", "#f97316"],
      ["#4ade80", "#22d3ee", "#34d399", "#a3e635"]
    ];

    const state = {
      paletteIndex: 0,
      speed: 1,
      lastPaletteShift: Date.now()
    };

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        Object.assign(state, JSON.parse(raw));
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    class Blob {
      constructor(index) {
        this.index = index;
        this.reset(true);
      }

      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.baseR = Math.random() * 140 + 70;
        this.r = this.baseR;
        this.vx = (Math.random() - 0.5) * 0.42;
        this.vy = (Math.random() - 0.5) * 0.42;
        this.seed = Math.random() * Math.PI * 2;
        this.turn = (Math.random() - 0.5) * 0.0022;
        this.colorPick = Math.random();
        if (!initial) {
          this.vx *= 1.6;
          this.vy *= 1.6;
        }
      }

      step(time, speed) {
        this.seed += 0.008 * speed;
        this.r = this.baseR * (0.75 + 0.3 * Math.sin(time * 0.0007 + this.seed));
        this.vx += Math.cos(this.seed * 1.8) * this.turn;
        this.vy += Math.sin(this.seed * 1.6) * this.turn;

        const swirlX = width * 0.5 + Math.cos(time * 0.00014 + this.index) * width * 0.22;
        const swirlY = height * 0.5 + Math.sin(time * 0.00017 + this.index * 0.77) * height * 0.2;
        this.vx += (swirlX - this.x) * 0.000008 * speed;
        this.vy += (swirlY - this.y) * 0.000008 * speed;

        this.x += this.vx * speed;
        this.y += this.vy * speed;

        if (this.x < -this.r) this.x = width + this.r;
        if (this.x > width + this.r) this.x = -this.r;
        if (this.y < -this.r) this.y = height + this.r;
        if (this.y > height + this.r) this.y = -this.r;
      }

      draw(colors, time) {
        const idx = Math.floor(this.colorPick * colors.length) % colors.length;
        const next = (idx + 1) % colors.length;
        const pulse = (Math.sin(time * 0.0013 + this.seed) + 1) * 0.5;

        const grad = ctx.createRadialGradient(
          this.x - this.r * 0.25,
          this.y - this.r * 0.2,
          this.r * 0.1,
          this.x,
          this.y,
          this.r
        );

        grad.addColorStop(0, hexToRgba(colors[idx], 0.62 + pulse * 0.18));
        grad.addColorStop(0.5, hexToRgba(colors[next], 0.32 + pulse * 0.14));
        grad.addColorStop(1, hexToRgba(colors[idx], 0));

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function hexToRgba(hex, alpha) {
      const clean = hex.replace("#", "");
      const bigint = parseInt(clean, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    const blobCount = 14;
    const blobs = Array.from({ length: blobCount }, (_, i) => new Blob(i));

    function shiftPalette() {
      state.paletteIndex = (state.paletteIndex + 1) % palettes.length;
      state.lastPaletteShift = Date.now();
      saveState();
    }

    function animate(now) {
      const colors = palettes[state.paletteIndex];

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(2, 6, 23, 0.13)";
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = "lighter";
      for (const blob of blobs) {
        blob.step(now, state.speed);
        blob.draw(colors, now);
      }

      ctx.globalCompositeOperation = "screen";
      for (let i = 0; i < 16; i++) {
        const t = now * 0.0002 + i * 0.45;
        const x = width * (0.5 + Math.cos(t * 1.2 + i) * (0.06 + i * 0.004));
        const y = height * (0.5 + Math.sin(t * 1.1 - i) * (0.05 + i * 0.003));
        const r = 3 + Math.sin(t * 3 + i) * 2;
        ctx.fillStyle = `rgba(180, 220, 255, ${0.05 + (i % 4) * 0.01})`;
        ctx.beginPath();
        ctx.arc(x, y, Math.max(1, r), 0, Math.PI * 2);
        ctx.fill();
      }

      if (now - state.lastPaletteShift > 12000) {
        shiftPalette();
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);

    window.addEventListener("click", () => {
      shiftPalette();
      for (const blob of blobs) {
        blob.reset();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        state.speed = state.speed === 1 ? 0.35 : 1;
        saveState();
      }
    });

    window.addEventListener("beforeunload", saveState);

    loadState();
    resize();
    saveState();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
