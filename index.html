<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Particle Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    user-select: none;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
    min-width: 220px;
    transition: opacity 0.3s;
  }
  #ui h1 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #ff6fd8, #3813c2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .control { margin-bottom: 10px; }
  .control label {
    display: block;
    font-size: 11px;
    color: #aaa;
    margin-bottom: 4px;
  }
  .control input[type="range"] {
    width: 100%;
    accent-color: #ff6fd8;
  }
  .control select, .control button {
    width: 100%;
    padding: 6px 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }
  .control button:hover { background: rgba(255,255,255,0.15); }
  #stats {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
  }
  #help {
    position: fixed;
    bottom: 16px;
    right: 16px;
    font-size: 11px;
    color: #666;
    text-align: right;
    z-index: 10;
    line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <h1>Gravity Particles</h1>
  <div class="control">
    <label>パーティクル数: <span id="countLabel">500</span></label>
    <input type="range" id="countSlider" min="100" max="3000" value="500" step="50">
  </div>
  <div class="control">
    <label>重力の強さ: <span id="gravLabel">1.0</span></label>
    <input type="range" id="gravSlider" min="0.1" max="5" value="1" step="0.1">
  </div>
  <div class="control">
    <label>トレイル長: <span id="trailLabel">0.92</span></label>
    <input type="range" id="trailSlider" min="0" max="0.98" value="0.92" step="0.01">
  </div>
  <div class="control">
    <label>カラーモード</label>
    <select id="colorMode">
      <option value="velocity">速度</option>
      <option value="rainbow">レインボー</option>
      <option value="distance">距離</option>
      <option value="fire">ファイア</option>
      <option value="ocean">オーシャン</option>
    </select>
  </div>
  <div class="control">
    <button id="resetBtn">リセット</button>
  </div>
  <div class="control">
    <button id="explosionBtn">💥 爆発</button>
  </div>
  <div class="control">
    <button id="vortexBtn">🌀 渦</button>
  </div>
</div>

<div id="stats"></div>
<div id="help">
  クリック: 引力 ｜ 右クリック: 斥力<br>
  スクロール: 重力調整 ｜ スペース: 一時停止
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// State
let particles = [];
let attractors = [];
let paused = false;
let time = 0;
let vortexMode = false;

// Settings
const settings = {
  count: 500,
  gravity: 1.0,
  trail: 0.92,
  colorMode: 'velocity',
};

// UI bindings
const countSlider = document.getElementById('countSlider');
const gravSlider = document.getElementById('gravSlider');
const trailSlider = document.getElementById('trailSlider');
const colorMode = document.getElementById('colorMode');

countSlider.addEventListener('input', e => {
  settings.count = +e.target.value;
  document.getElementById('countLabel').textContent = settings.count;
  initParticles();
});
gravSlider.addEventListener('input', e => {
  settings.gravity = +e.target.value;
  document.getElementById('gravLabel').textContent = settings.gravity.toFixed(1);
});
trailSlider.addEventListener('input', e => {
  settings.trail = +e.target.value;
  document.getElementById('trailLabel').textContent = settings.trail.toFixed(2);
});
colorMode.addEventListener('change', e => {
  settings.colorMode = e.target.value;
});
document.getElementById('resetBtn').addEventListener('click', initParticles);
document.getElementById('explosionBtn').addEventListener('click', explosion);
document.getElementById('vortexBtn').addEventListener('click', () => { vortexMode = !vortexMode; });

// Particle
function createParticle() {
  const angle = Math.random() * Math.PI * 2;
  const speed = Math.random() * 0.5;
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 1,
    hue: Math.random() * 360,
    size: 1 + Math.random() * 2,
  };
}

function initParticles() {
  particles = [];
  for (let i = 0; i < settings.count; i++) {
    particles.push(createParticle());
  }
}
initParticles();

// Mouse
let mouse = { x: W / 2, y: H / 2, down: false, right: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  if (e.button === 2) mouse.right = true;
  else mouse.down = true;
});
canvas.addEventListener('mouseup', e => {
  if (e.button === 2) mouse.right = false;
  else mouse.down = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  settings.gravity = Math.max(0.1, Math.min(5, settings.gravity + e.deltaY * -0.002));
  gravSlider.value = settings.gravity;
  document.getElementById('gravLabel').textContent = settings.gravity.toFixed(1);
});

// Touch
canvas.addEventListener('touchstart', e => { e.preventDefault(); mouse.down = true; mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
canvas.addEventListener('touchmove', e => { e.preventDefault(); mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
canvas.addEventListener('touchend', () => { mouse.down = false; });

// Keyboard
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
});

function explosion() {
  const cx = W / 2, cy = H / 2;
  for (const p of particles) {
    const dx = p.x - cx;
    const dy = p.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) + 1;
    const force = 20 / dist * 50;
    p.vx += (dx / dist) * force;
    p.vy += (dy / dist) * force;
  }
}

// Color
function getColor(p, i) {
  const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  const dx = p.x - W / 2;
  const dy = p.y - H / 2;
  const dist = Math.sqrt(dx * dx + dy * dy);

  switch (settings.colorMode) {
    case 'velocity': {
      const hue = Math.min(speed * 20, 1) * 270;
      return `hsla(${hue}, 100%, ${50 + speed * 10}%, ${0.7 + speed * 0.1})`;
    }
    case 'rainbow': {
      const hue = (i / particles.length * 360 + time * 0.5) % 360;
      return `hsla(${hue}, 85%, 60%, 0.8)`;
    }
    case 'distance': {
      const hue = (dist / Math.max(W, H)) * 270;
      return `hsla(${hue}, 90%, 55%, 0.8)`;
    }
    case 'fire': {
      const t = Math.min(speed * 15, 1);
      const r = 255;
      const g = Math.floor(t * 180);
      const b = Math.floor(t * t * 60);
      return `rgba(${r},${g},${b},${0.6 + t * 0.3})`;
    }
    case 'ocean': {
      const t = Math.min(speed * 15, 1);
      const r = Math.floor(t * 100);
      const g = Math.floor(100 + t * 155);
      const b = 200 + Math.floor(t * 55);
      return `rgba(${r},${g},${b},${0.6 + t * 0.3})`;
    }
    default:
      return '#fff';
  }
}

// Update
function update() {
  if (paused) return;
  time++;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // Mouse gravity
    if (mouse.down || mouse.right) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 10;
      const force = settings.gravity * 300 / (dist * dist);
      const sign = mouse.right ? -1 : 1;
      p.vx += sign * (dx / dist) * force;
      p.vy += sign * (dy / dist) * force;
    }

    // Vortex
    if (vortexMode) {
      const dx = W / 2 - p.x;
      const dy = H / 2 - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 10;
      const force = settings.gravity * 0.5 / dist;
      // Tangential + radial
      p.vx += (-dy / dist) * force + (dx / dist) * force * 0.3;
      p.vy += (dx / dist) * force + (dy / dist) * force * 0.3;
    }

    // Damping
    p.vx *= 0.998;
    p.vy *= 0.998;

    // Move
    p.x += p.vx;
    p.y += p.vy;

    // Wrap around
    if (p.x < 0) p.x += W;
    if (p.x > W) p.x -= W;
    if (p.y < 0) p.y += H;
    if (p.y > H) p.y -= H;
  }
}

// Draw
function draw() {
  // Trail effect
  ctx.fillStyle = `rgba(0, 0, 0, ${1 - settings.trail})`;
  ctx.fillRect(0, 0, W, H);

  // Glow at mouse
  if (mouse.down || mouse.right) {
    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 150);
    const color = mouse.right ? 'rgba(255,50,50,' : 'rgba(100,150,255,';
    grad.addColorStop(0, color + '0.15)');
    grad.addColorStop(1, color + '0)');
    ctx.fillStyle = grad;
    ctx.fillRect(mouse.x - 150, mouse.y - 150, 300, 300);
  }

  // Particles
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const size = p.size * Math.min(1 + speed * 0.3, 3);

    ctx.fillStyle = getColor(p, i);
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// FPS
let frameCount = 0;
let lastFpsTime = performance.now();
let fps = 0;

function loop() {
  update();
  draw();

  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('stats').textContent =
      `${particles.length} particles | ${fps} fps${paused ? ' | PAUSED' : ''}${vortexMode ? ' | VORTEX' : ''}`;
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
