<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eternal Atlas RPG - JRPG Battle Edition</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.92);
      --line: rgba(148, 163, 184, 0.36);
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #e2e8f0;
      background: radial-gradient(circle at top, #1e293b, var(--bg) 55%);
    }

    #app {
      width: 100%;
      height: 100%;
      padding: 10px;
      display: grid;
      gap: 10px;
      grid-template-columns: 320px 1fr 320px;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      color: #bae6fd;
      font-size: .92rem;
      letter-spacing: .08em;
    }
    .content {
      padding: 10px;
      overflow: auto;
      font-size: .9rem;
    }
    .entry {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(2, 6, 23, .45);
      padding: 8px;
      margin-bottom: 8px;
    }
    .bar {
      height: 10px;
      border-radius: 999px;
      margin-top: 4px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, .95);
    }
    .bar > div { height: 100%; }
    .hp { background: linear-gradient(90deg, #22c55e, #86efac); }
    .mp { background: linear-gradient(90deg, #3b82f6, #7dd3fc); }
    .xp { background: linear-gradient(90deg, #f59e0b, #fde68a); }

    #worldWrap {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #020617;
      min-height: 0;
    }
    #world { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 10px;
      font-weight: 800;
      text-shadow: 0 2px 8px #000;
      color: #e0f2fe;
    }

    #state { margin-bottom: 8px; }
    .cmdGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(15, 23, 42, .96);
      color: #e2e8f0;
      font-weight: 700;
      cursor: pointer;
      padding: 9px;
    }
    button:hover { border-color: var(--accent); color: #7dd3fc; }

    #eventLog {
      height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(2,6,23,.66);
      padding: 8px;
    }

    /* JRPG battle screen */
    #battleScreen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      background: radial-gradient(circle at 55% 30%, rgba(14,116,144,.35), rgba(2,6,23,.98));
    }
    #battleFrame {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr 230px;
    }
    #battleField {
      position: relative;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(21, 94, 117, .25), rgba(2, 6, 23, .2) 45%, rgba(15, 23, 42, .95));
      overflow: hidden;
    }
    .enemyRow {
      position: absolute;
      top: 20%;
      right: 8%;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .enemyCard {
      width: 180px;
      text-align: center;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.8));
    }
    .enemyCard img {
      width: 100%;
      image-rendering: crisp-edges;
    }
    .enemyNameTag {
      margin-top: -8px;
      background: rgba(15,23,42,.85);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: .84rem;
    }

    .partyRow {
      position: absolute;
      left: 8%;
      bottom: 10%;
      display: flex;
      gap: 18px;
      align-items: flex-end;
    }
    .heroToken {
      width: 64px;
      height: 64px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #7dd3fc, #0f172a);
      position: relative;
    }
    .heroToken::before {
      content: "⚔";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    #battleUI {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      gap: 10px;
      padding: 10px;
      background: rgba(2,6,23,.88);
    }
    .jrpgBox {
      border: 2px solid #1d4ed8;
      border-radius: 10px;
      background: rgba(15,23,42,.95);
      box-shadow: inset 0 0 0 1px rgba(191,219,254,.5);
      min-height: 0;
    }
    #battleCommands {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-content: start;
    }
    #battleCommands button { text-align: left; }
    #battleConsole {
      padding: 10px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      min-height: 0;
    }
    #battleHeadline { font-weight: 800; color: #93c5fd; }
    #battleLog {
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: .93rem;
    }
    #partyStatus {
      padding: 10px;
      display: grid;
      gap: 8px;
      align-content: start;
      font-size: .88rem;
    }

    @media (max-width: 1100px) {
      #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(320px, 45vh) auto; }
      .panel { max-height: 30vh; }
      #battleFrame { grid-template-rows: 1fr 320px; }
      #battleUI { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <section class="panel">
      <h2>HERO STATUS</h2>
      <div id="heroPanel" class="content"></div>
      <h2>QUEST LOG</h2>
      <div id="questPanel" class="content"></div>
    </section>

    <section id="worldWrap">
      <canvas id="world"></canvas>
      <div id="overlay"></div>
    </section>

    <section class="panel">
      <h2>COMMAND / LOG</h2>
      <div class="content">
        <div id="state">探索中: WASD / 矢印で移動、Eで調査</div>
        <div class="cmdGrid">
          <button id="attackBtn">攻撃</button>
          <button id="magicBtn">魔法</button>
          <button id="guardBtn">防御</button>
          <button id="itemBtn">回復薬</button>
        </div>
        <div class="entry" style="margin-top:8px;">エンカウントすると専用バトル画面へ遷移。<br>表: 冥王アバドン / 裏: 深淵竜ネブラ。</div>
        <h2 style="margin:10px 0 8px 0; padding:0; border:none;">EVENT LOG</h2>
        <div id="eventLog"></div>
        <h2 style="margin:10px 0 8px 0; padding:0; border:none;">MONSTER BOOK</h2>
        <div id="book"></div>
      </div>
    </section>
  </div>

  <section id="battleScreen">
    <div id="battleFrame">
      <div id="battleField">
        <div class="enemyRow">
          <div class="enemyCard">
            <img id="enemySprite" alt="enemy" />
            <div id="enemyName" class="enemyNameTag">Enemy</div>
          </div>
        </div>
        <div class="partyRow">
          <div class="heroToken"></div>
          <div class="heroToken" style="opacity:.72; transform:scale(.9)"></div>
          <div class="heroToken" style="opacity:.58; transform:scale(.84)"></div>
        </div>
      </div>

      <div id="battleUI">
        <div id="battleCommands" class="jrpgBox">
          <button id="bAttack">▶ こうげき</button>
          <button id="bMagic">▶ スキル / まほう</button>
          <button id="bItem">▶ アイテム</button>
          <button id="bGuard">▶ ぼうぎょ</button>
        </div>

        <div id="battleConsole" class="jrpgBox">
          <div id="battleHeadline">敵と遭遇した！</div>
          <div id="battleLog"></div>
        </div>

        <div id="partyStatus" class="jrpgBox"></div>
      </div>
    </div>
  </section>

  <script>
    const TILE = 28;
    const MAP_W = 100;
    const MAP_H = 76;
    const VIEW_W = 34;
    const VIEW_H = 22;

    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const heroPanel = document.getElementById('heroPanel');
    const questPanel = document.getElementById('questPanel');
    const stateEl = document.getElementById('state');
    const overlay = document.getElementById('overlay');
    const eventLogEl = document.getElementById('eventLog');
    const bookEl = document.getElementById('book');

    const battleScreen = document.getElementById('battleScreen');
    const battleHeadline = document.getElementById('battleHeadline');
    const battleLogEl = document.getElementById('battleLog');
    const enemySpriteEl = document.getElementById('enemySprite');
    const enemyNameEl = document.getElementById('enemyName');
    const partyStatusEl = document.getElementById('partyStatus');

    const input = Object.create(null);
    let map = [];
    let battle = null;
    let anim = 0;

    const hero = {
      x: 4, y: 4,
      maxHp: 250, hp: 250,
      maxMp: 85, mp: 85,
      atk: 28, def: 13,
      lvl: 1, xp: 0, nextXp: 75,
      potions: 5,
      weaponTier: 1,
      flags: { castleKey: false, bridge: false, tower: false, clearFront: false, clearTrue: false }
    };

    const monsters = [
      { id: 'slime', name: '蒼スライム', hp: 60, atk: 12, def: 5, xp: 22, tiles: ['.', 'v'] },
      { id: 'wolf', name: '影狼', hp: 86, atk: 17, def: 7, xp: 34, tiles: ['f', '.', 'v'] },
      { id: 'golem', name: '遺跡ゴーレム', hp: 160, atk: 25, def: 16, xp: 62, tiles: ['m', 'r'] },
      { id: 'wyvern', name: '黄昏ワイバーン', hp: 218, atk: 31, def: 17, xp: 88, tiles: ['w', 'm'] }
    ];
    const bosses = {
      final: { id: 'demonlord', name: '冥王アバドン', hp: 590, atk: 43, def: 23, xp: 240 },
      true: { id: 'abyssdragon', name: '深淵竜ネブラ', hp: 820, atk: 50, def: 29, xp: 340 }
    };

    const events = {
      C: { name: '王都シルフィア', text: '王都に到達。冥王討伐の勅命を受けた。' },
      K: { name: '古城の鍵', text: '古城の鍵を回収。封印城へ入れる。', grant: 'castleKey' },
      B: { name: '橋の建設依頼', text: '橋を建設し、深淵方面へ進めるようになった。', grant: 'bridge' },
      M: { name: '魔導塔', text: '奥義を習得。魔法威力が上昇。', grant: 'tower' },
      E: { name: '封印城', text: '冥王との決戦が始まる。' },
      D: { name: '深淵の祭壇', text: '真の敵の気配が渦巻く。' }
    };

    const bestiary = new Map();
    const worldLogLines = [];

    function makeSprite(primary, secondary, label) {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'>
        <defs><radialGradient id='g'><stop offset='0%' stop-color='${secondary}'/><stop offset='100%' stop-color='${primary}'/></radialGradient></defs>
        <ellipse cx='120' cy='196' rx='74' ry='19' fill='rgba(0,0,0,.35)'/>
        <path d='M52 168 Q25 98 84 52 Q120 18 156 52 Q215 98 188 168 Z' fill='url(#g)' stroke='rgba(255,255,255,.65)' stroke-width='4'/>
        <circle cx='96' cy='112' r='11' fill='white'/><circle cx='144' cy='112' r='11' fill='white'/>
        <circle cx='96' cy='112' r='4.5' fill='#0f172a'/><circle cx='144' cy='112' r='4.5' fill='#0f172a'/>
        <path d='M88 148 Q120 170 152 148' stroke='rgba(15,23,42,.85)' stroke-width='5' fill='none' stroke-linecap='round'/>
        <text x='120' y='216' text-anchor='middle' font-size='18' fill='rgba(226,232,240,.95)' font-family='sans-serif'>${label}</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    const sprites = {
      slime: makeSprite('#38bdf8', '#bae6fd', 'SLIME'),
      wolf: makeSprite('#94a3b8', '#e2e8f0', 'WOLF'),
      golem: makeSprite('#a78bfa', '#ddd6fe', 'GOLEM'),
      wyvern: makeSprite('#f97316', '#fed7aa', 'WYVERN'),
      demonlord: makeSprite('#ef4444', '#fecaca', 'ABADDON'),
      abyssdragon: makeSprite('#22d3ee', '#a5f3fc', 'NEBULA')
    };

    function pushWorldLog(msg) {
      worldLogLines.unshift(msg);
      if (worldLogLines.length > 90) worldLogLines.length = 90;
      eventLogEl.textContent = worldLogLines.join('\n');
    }

    function buildMap() {
      map = Array.from({ length: MAP_H }, (_, y) =>
        Array.from({ length: MAP_W }, (_, x) => {
          if (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1) return '#';
          const n = Math.sin(x * 0.24) + Math.cos(y * 0.2) + Math.sin((x + y) * 0.15);
          if (n > 1.55) return 'm';
          if (n < -1.32) return 'w';
          if ((x * y) % 13 === 0) return 'f';
          if ((x + y) % 17 === 0) return 'v';
          if ((x + y) % 19 === 0) return 'r';
          return '.';
        })
      );

      setTile(8, 8, 'C');
      setTile(28, 14, 'K');
      setTile(49, 26, 'B');
      setTile(67, 20, 'M');
      setTile(82, 50, 'E');
      setTile(93, 66, 'D');

      for (let x = 1; x < MAP_W - 1; x++) map[8][x] = '.';
      for (let y = 8; y <= 66; y++) map[y][20] = '.';
      for (let x = 20; x <= 94; x++) map[66][x] = '.';
      setTile(8, 8, 'C'); setTile(28, 14, 'K'); setTile(49, 26, 'B'); setTile(67, 20, 'M'); setTile(82, 50, 'E'); setTile(93, 66, 'D');
    }

    function setTile(x, y, ch) { if (map[y] && map[y][x] !== undefined) map[y][x] = ch; }
    function tileAt(x, y) {
      if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return '#';
      return map[y][x];
    }
    function passable(ch) {
      if (ch === '#') return false;
      if (ch === 'E' && !hero.flags.castleKey) return false;
      if (ch === 'D' && !hero.flags.bridge) return false;
      return true;
    }

    function discover(enemy) {
      if (!bestiary.has(enemy.id)) {
        bestiary.set(enemy.id, { ...enemy });
        pushWorldLog(`図鑑登録: ${enemy.name}`);
      }
    }

    function gainLevel() {
      while (hero.xp >= hero.nextXp) {
        hero.xp -= hero.nextXp;
        hero.lvl++;
        hero.nextXp = Math.floor(hero.nextXp * 1.35);
        hero.maxHp += 44;
        hero.maxMp += 12;
        hero.atk += 7;
        hero.def += 4;
        hero.hp = hero.maxHp;
        hero.mp = hero.maxMp;
        hero.potions++;
        pushWorldLog(`レベルアップ！ Lv${hero.lvl} になった。`);
      }
    }

    function battleLog(msg) {
      if (!battle) return;
      battle.logs.unshift(msg);
      if (battle.logs.length > 10) battle.logs.length = 10; // 伸びすぎ対策
      battleLogEl.textContent = battle.logs.join('\n');
      pushWorldLog(msg);
    }

    function openBattle(enemyData) {
      battle = {
        enemy: JSON.parse(JSON.stringify(enemyData)),
        guarding: false,
        logs: []
      };
      discover(enemyData);
      enemySpriteEl.src = sprites[enemyData.id] || sprites.slime;
      enemyNameEl.textContent = `${enemyData.name}  HP:${enemyData.hp}`;
      battleHeadline.textContent = `${enemyData.name} があらわれた！`;
      battleScreen.style.display = 'block';
      overlay.textContent = `⚔ ${enemyData.name} と交戦中`;
      battleLog('戦闘開始。コマンドを選択。');
      refreshUI();
    }

    function closeBattle(victory) {
      if (!battle) return;
      if (victory) {
        hero.xp += battle.enemy.xp;
        pushWorldLog(`${battle.enemy.name}を撃破！ XP+${battle.enemy.xp}`);
        if (battle.enemy.id === 'demonlord') {
          hero.flags.clearFront = true;
          pushWorldLog('表クリア達成。深淵の祭壇が目覚める。');
        }
        if (battle.enemy.id === 'abyssdragon') {
          hero.flags.clearTrue = true;
          pushWorldLog('裏クリア達成。真の平和が訪れた。');
        }
        gainLevel();
      }
      battle = null;
      battleScreen.style.display = 'none';
      overlay.textContent = '';
      refreshUI();
    }

    function enemyTurn() {
      if (!battle) return;
      let dmg = Math.max(1, battle.enemy.atk - hero.def + Math.floor(Math.random() * 10) - 3);
      if (battle.guarding) dmg = Math.floor(dmg * 0.45);
      hero.hp -= dmg;
      battle.guarding = false;
      battleLog(`${battle.enemy.name}の攻撃 ${dmg} ダメージ`);

      if (hero.hp <= 0) {
        hero.hp = 1;
        hero.x = 4;
        hero.y = 4;
        battleLog('力尽きた…拠点へ戻された。');
        battle = null;
        battleScreen.style.display = 'none';
        overlay.textContent = '';
      }
    }

    function playerTurn(cmd) {
      if (!battle) return;
      const e = battle.enemy;

      if (cmd === 'attack') {
        const dmg = Math.max(1, hero.atk + hero.weaponTier * 3 - e.def + Math.floor(Math.random() * 12));
        e.hp -= dmg;
        battleLog(`こうげき！ ${dmg} ダメージ`);
      } else if (cmd === 'magic') {
        const cost = 12;
        if (hero.mp < cost) {
          battleLog('MPが足りない。');
          refreshUI();
          return;
        }
        hero.mp -= cost;
        const boost = hero.flags.tower ? 1.8 : 1.35;
        const dmg = Math.floor(hero.atk * boost + hero.lvl * 2 + Math.random() * 18);
        e.hp -= dmg;
        battleLog(`まほう《スターブレイク》 ${dmg} ダメージ`);
      } else if (cmd === 'item') {
        if (hero.potions <= 0) {
          battleLog('回復薬がない。');
          refreshUI();
          return;
        }
        hero.potions--;
        const heal = Math.min(hero.maxHp - hero.hp, 95);
        hero.hp += heal;
        battleLog(`回復薬でHP ${heal} 回復`);
      } else if (cmd === 'guard') {
        battle.guarding = true;
        battleLog('ぼうぎょ体勢。次の被ダメージ軽減。');
      }

      if (e.hp <= 0) {
        closeBattle(true);
        return;
      }

      enemyNameEl.textContent = `${e.name}  HP:${Math.max(0, Math.ceil(e.hp))}`;
      enemyTurn();
      refreshUI();
    }

    function checkEvent(ch) {
      const ev = events[ch];
      if (!ev) return;
      pushWorldLog(`[イベント] ${ev.name}: ${ev.text}`);
      if (ev.grant && !hero.flags[ev.grant]) {
        hero.flags[ev.grant] = true;
        if (ev.grant === 'tower') hero.weaponTier = 2;
      }
      if (ch === 'E') openBattle(bosses.final);
      if (ch === 'D') {
        if (!hero.flags.clearFront) pushWorldLog('祭壇は沈黙している。先に冥王を倒そう。');
        else openBattle(bosses.true);
      }
    }

    function randomEncounter(ch) {
      if (battle || '#CKBMED'.includes(ch)) return;
      const rate = ch === 'f' ? 0.2 : ch === 'm' ? 0.22 : ch === 'w' ? 0.18 : 0.11;
      if (Math.random() > rate) return;
      const pool = monsters.filter(m => m.tiles.includes(ch) || m.tiles.includes('.'));
      const enemy = pool[Math.floor(Math.random() * pool.length)];
      openBattle(enemy);
    }

    function moveHero(dx, dy) {
      if (battle) return;
      const nx = hero.x + dx;
      const ny = hero.y + dy;
      const ch = tileAt(nx, ny);
      if (!passable(ch)) {
        pushWorldLog(ch === 'E' ? '封印城には鍵が必要。' : ch === 'D' ? '深淵への橋が必要。' : '進めない。');
        return;
      }
      hero.x = nx;
      hero.y = ny;
      if (events[ch] && ['K', 'B', 'M'].includes(ch)) checkEvent(ch);
      randomEncounter(ch);
      refreshUI();
    }

    function drawTile(ch, x, y) {
      const palette = {
        '#': '#334155', '.': '#14532d', 'f': '#166534', 'v': '#0f766e',
        'm': '#4c1d95', 'w': '#0f172a', 'r': '#475569',
        'C': '#38bdf8', 'K': '#facc15', 'B': '#fb7185', 'M': '#a78bfa', 'E': '#ef4444', 'D': '#f97316'
      };
      ctx.fillStyle = palette[ch] || '#1e293b';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.strokeStyle = 'rgba(15,23,42,.35)';
      ctx.strokeRect(x, y, TILE, TILE);

      if ('CKBMED'.includes(ch)) {
        const pulse = 0.45 + (Math.sin(anim / 260) + 1) * 0.22;
        ctx.fillStyle = `rgba(255,255,255,${pulse})`;
        ctx.beginPath();
        ctx.arc(x + TILE / 2, y + TILE / 2, 4 + pulse * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function renderWorld() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = canvas.clientWidth || canvas.parentElement.clientWidth;
      const h = canvas.clientHeight || canvas.parentElement.clientHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const sx = Math.max(0, Math.min(MAP_W - VIEW_W, hero.x - Math.floor(VIEW_W / 2)));
      const sy = Math.max(0, Math.min(MAP_H - VIEW_H, hero.y - Math.floor(VIEW_H / 2)));

      ctx.clearRect(0, 0, w, h);
      const ox = Math.floor((w - VIEW_W * TILE) / 2);
      const oy = Math.floor((h - VIEW_H * TILE) / 2);
      ctx.save();
      ctx.translate(ox, oy);

      for (let y = 0; y < VIEW_H; y++) {
        for (let x = 0; x < VIEW_W; x++) {
          drawTile(tileAt(sx + x, sy + y), x * TILE, y * TILE);
        }
      }

      const hx = (hero.x - sx) * TILE + TILE / 2;
      const hy = (hero.y - sy) * TILE + TILE / 2;
      ctx.save();
      ctx.translate(hx, hy);
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath(); ctx.arc(0, -5, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(-7, 2, 14, 14);
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(8, 3, 4, 11);
      ctx.restore();

      ctx.restore();
    }

    function bar(v, max, cls) {
      const p = Math.max(0, Math.min(100, (v / max) * 100));
      return `<div class='bar'><div class='${cls}' style='width:${p}%'></div></div>`;
    }

    function refreshUI() {
      heroPanel.innerHTML = `
        <div class='entry'><b>Lv.${hero.lvl} 探索者アルト</b><br>
          HP ${Math.ceil(hero.hp)} / ${hero.maxHp}${bar(hero.hp, hero.maxHp, 'hp')}
          MP ${Math.ceil(hero.mp)} / ${hero.maxMp}${bar(hero.mp, hero.maxMp, 'mp')}
          XP ${hero.xp} / ${hero.nextXp}${bar(hero.xp, hero.nextXp, 'xp')}
        </div>
        <div class='entry'>攻撃 ${hero.atk} / 防御 ${hero.def} / 回復薬 ${hero.potions}</div>
      `;

      questPanel.innerHTML = `
        <div class='entry'>表クリア: 冥王アバドン撃破 ${hero.flags.clearFront ? '✅' : '⬜'}</div>
        <div class='entry'>裏クリア: 深淵竜ネブラ撃破 ${hero.flags.clearTrue ? '✅' : '⬜'}</div>
        <div class='entry'>古城の鍵 ${hero.flags.castleKey ? '✅' : '⬜'} / 橋建設 ${hero.flags.bridge ? '✅' : '⬜'} / 魔導塔奥義 ${hero.flags.tower ? '✅' : '⬜'}</div>
        <div class='entry'>図鑑 ${bestiary.size} / 6</div>
        <div class='entry'>想定ボリューム: 探索+育成+図鑑埋めで約3時間。</div>
      `;

      const ids = ['slime', 'wolf', 'golem', 'wyvern', 'demonlord', 'abyssdragon'];
      bookEl.innerHTML = ids.map(id => {
        const m = bestiary.get(id);
        if (!m) return `<div class='entry'>${id}: ???</div>`;
        return `<div class='entry'><b>${m.name}</b><br>HP:${m.hp} ATK:${m.atk} DEF:${m.def}</div>`;
      }).join('');

      stateEl.textContent = `探索中: 位置(${hero.x}, ${hero.y}) / マップ ${MAP_W}x${MAP_H}`;

      partyStatusEl.innerHTML = `
        <div><b>アルト Lv.${hero.lvl}</b></div>
        <div>HP ${Math.ceil(hero.hp)} / ${hero.maxHp}${bar(hero.hp, hero.maxHp, 'hp')}</div>
        <div>MP ${Math.ceil(hero.mp)} / ${hero.maxMp}${bar(hero.mp, hero.maxMp, 'mp')}</div>
        <div>回復薬 ${hero.potions}</div>
      `;
    }

    function gameLoop(ts) {
      anim = ts;

      if (!battle) {
        if (input.ArrowUp || input.w) moveHero(0, -1);
        else if (input.ArrowDown || input.s) moveHero(0, 1);
        else if (input.ArrowLeft || input.a) moveHero(-1, 0);
        else if (input.ArrowRight || input.d) moveHero(1, 0);

        if (input.e) {
          checkEvent(tileAt(hero.x, hero.y));
          input.e = false;
        }
      }

      if (hero.flags.clearFront && hero.flags.clearTrue && bestiary.size === 6) {
        overlay.textContent = '★ 図鑑完成 + 真エンド達成 ★';
      }

      renderWorld();
      requestAnimationFrame(gameLoop);
    }

    document.getElementById('attackBtn').onclick = () => playerTurn('attack');
    document.getElementById('magicBtn').onclick = () => playerTurn('magic');
    document.getElementById('guardBtn').onclick = () => playerTurn('guard');
    document.getElementById('itemBtn').onclick = () => playerTurn('item');

    document.getElementById('bAttack').onclick = () => playerTurn('attack');
    document.getElementById('bMagic').onclick = () => playerTurn('magic');
    document.getElementById('bGuard').onclick = () => playerTurn('guard');
    document.getElementById('bItem').onclick = () => playerTurn('item');

    addEventListener('keydown', e => {
      input[e.key] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    });
    addEventListener('keyup', e => { input[e.key] = false; });

    buildMap();
    pushWorldLog('JRPG Battle Edition 起動。広域マップを探索し、鍵・橋・奥義を揃えて世界を救え。');
    refreshUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
